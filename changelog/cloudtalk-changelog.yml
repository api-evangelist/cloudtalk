note: >-
  CloudTalk publishes NO API-specific changelog. There is no dated release feed on the developer
  reference (https://developers.cloudtalk.io/changelog returns the SPA shell, HTTP 200 HTML, not a
  changelog), and the OpenAPI document carries only a flat info.version of "1.7" with no history.
  What CloudTalk does publish is a PRODUCT changelog across three surfaces, captured below. The
  distinction matters: an integrator cannot learn from any published source when a REST operation
  changed.
