- date: '2026-01-16'
  title: Product Update — December 2025 & early January 2026
  url: https://www.cloudtalk.io/blog/product-update-january-2026/
  breaking: false
  api_affecting: false
  highlights:
  - Invoice Management — download invoice PDFs from the dashboard
  - CSV upload now supports campaign tags and preferred-agent assignment during import
  - Faster CSV processing with clearer error reporting and status logs
  - Mobile calling — streamlined message sending and contact assignment from the dialpad
  - Mobile messaging — read/unread thread filters, channel filtering, typing indicators
  - Zendesk integration — consolidated call exports, internal note defaults, embedded recordings
  - Real-time dashboard now shows internal agent-to-agent calls in the Active Calls tab
  - Idle status reporting broken down by sub-status (break, lunch, meeting)
