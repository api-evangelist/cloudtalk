  /dialer/campaigns/{campaignId}/contacts:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: List a campaign's contacts
      description: 'Returns the campaign''s members ordered by dialing eligibility (`next_eligible_at`, then id), cursor-paginated. `meta.total` counts the filtered set, so it moves with `queueTag` and `search`.


        `queue_tag` on each row is a derived queue position, not the raw membership state: an open agent hold reads `assigned`, a scheduled callback reads `scheduled`, terminal states read as themselves, and a pending contact reads its waterfall category (`fresh`, `retry`, `rescheduled`, `favorite`).


        There is no contacts write route on this API — campaign membership is tag-defined, so contacts are added by tagging them in Contacts.'
      operationId: publicListCampaignContacts
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      - name: cursor
        in: query
        required: false
        description: 'Opaque cursor taken from `meta.nextCursor` of a previous page. Pass it back unchanged. Omitting `cursor`, or sending it empty, starts from the first page — neither is an error. A non-empty cursor this endpoint cannot decode is rejected with `400` and `code: "PAGINATION.INVALID_CURSOR"` rather than silently restarting the list. Handle it as an error, not as a terminating `null` cursor: a loop that only stops on `null` would re-send the same rejected cursor. Drop the stored cursor and restart from a checkpoint you control.'
        schema:
          type: string
        example: eyJuZXh0RWxpZ2libGVBdCI6IjIwMjYtMDgtMTIgMTI6MjI6MzEuOTIyNTY3KzAwIiwiaWQiOiI1MTAwIn0
      - name: limit
        in: query
        required: false
        description: Maximum number of contacts per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: queueTag
        in: query
        required: false
        description: Narrow to one or more queue positions. Repeat the parameter (`?queueTag=fresh&queueTag=retry`) or comma-separate (`?queueTag=fresh,retry`). An unknown value is a 400.
        schema:
          type: array
          items:
            type: string
            enum:
            - assigned
            - scheduled
            - completed
            - dnc
            - exhausted
            - excluded
            - fresh
            - retry
            - rescheduled
            - favorite
        explode: true
        example:
        - fresh
        - retry
      - name: search
        in: query
        required: false
        description: Case-insensitive substring match over the contact's display name and phone numbers. At most 200 characters.
        schema:
          type: string
          maxLength: 200
        example: kowalski
      responses:
        '200':
          description: One page of campaign contacts with a filtered-set total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaignContactList'
              example:
                data:
                - campaign_contact_id: '5100'
                  contact_id: '88213'
                  display_name: Jane Kowalski
                  phone_number: '+421900123456'
                  queue_tag: fresh
                  attempt_count: 0
                  next_eligible_at: '2026-08-04T08:00:00.000Z'
                  owner_user_id: null
                  callback_notes: null
                meta:
                  nextCursor: null
                  total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/campaigns/{campaignId}/contacts/next:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Peek at the next contacts to be dialed
      description: 'Returns, in order, the contacts the allocator would serve next — a read-only, NON-BINDING snapshot. Nothing is held, locked or recorded, so any of these contacts may be taken by an agent a moment later; treat the answer as a display hint, never a reservation. There is no partner-facing way to claim a contact.


        A campaign that exists but is not active, or whose queue is empty, answers 200 with an empty array — never 404. Contacts already held by an agent and contacts whose eligibility lies in the future are excluded. Callbacks pinned to a specific agent are not visible on this surface until their pin lapses.


        Unknown query parameters are rejected with 400 rather than ignored.'
