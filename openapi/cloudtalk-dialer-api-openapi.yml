          type: integer
          description: Attempts that were a repeat for the contact.
          example: 88
    DialerCreateSurveyRequest:
      type: object
      required:
      - name
      description: Body of the create-survey call.
      properties:
        name:
          type: string
          description: Display name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Post-call qualification
        questions:
          type: array
          description: Initial question set. Omit to create an empty survey.
