            $ref: '#/components/schemas/DialerSurveyQuestionInput'
    DialerCampaignList:
      type: object
      description: Cursor-paginated page of campaigns. Unlike the legacy CloudTalk endpoints this resource is **not** wrapped in `responseData`.
      properties:
        data:
          type: array
          description: One page of campaigns.
