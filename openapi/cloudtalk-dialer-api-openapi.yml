                correlationId: YevPQs
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/exports/{jobId}/download:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get a download link for a completed export
      description: 'Mints a fresh pre-signed S3 link for a completed export job and returns it in a JSON body together with the instant it expires. This is deliberately not a redirect and not a file stream: the body lets a machine consumer read the expiry, and HTTP clients that strip credentials on redirects cannot misbehave.


        Every call mints a new link, so the call is idempotent and repeatable — when a link expires, call again for a fresh one. Links live at least 60 minutes. The job itself never expires; only individual links do. The same link is also emailed to the requester when the job completes.


        A job that is still `queued` or `running` answers 409 (keep polling the export-status call); a `failed` job answers 409 with a message saying no file exists (terminal — stop polling). A job belonging to another company reads as 404.


        A `jobId` that is not a UUID is rejected with 400 before the job is looked up.'
      operationId: publicDownloadExportJob
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
