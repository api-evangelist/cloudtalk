              example:
                url: https://ct-dialer-exports.s3.eu-west-1.amazonaws.com/exports/700001/0197fbd1-6d0a-7e58-8f6f-1a2b3c4d5e6f/call_history-campaign-42.csv?X-Amz-Signature=…
                expiresAt: '2026-08-04T09:05:00.000Z'
        '400':
          description: The `jobId` in the path is not a UUID. Rejected before any lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerError'
              example:
                statusCode: 400
                message: Validation failed (uuid is expected)
                error: Bad Request
                correlationId: YevPQs
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
