          example: '2026-08-04T11:40:00.000Z'
    DialerCallDurationTotals:
      type:
      - object
      - 'null'
      description: 'Duration aggregate over the calls the basis covers; all values are whole seconds. Null means the block is not on the response — an all-time read without `includeDurations=true`, or a failed-open duration lookup. An all-zero block is a real answer: the window''s calls simply carry no recorded duration yet (`calls` can trail the dialed count — duration records lag the dial). Zero and null must be treated as different states.'
      properties:
        calls:
          type: integer
          description: Calls with a duration record.
          example: 238
        answered_calls:
          type: integer
          description: Of those, calls with talk time — the denominator of `avg_talk_seconds`.
          example: 150
        talk_seconds:
          type: integer
          description: Total talk time.
          example: 21540
        total_seconds:
          type: integer
          description: Total leg time — talk plus ring.
          example: 26310
        ring_seconds:
          type: integer
          description: '`total_seconds - talk_seconds`, floored at 0.'
          example: 4770
        avg_talk_seconds:
          type: integer
          description: Mean talk time over answered calls; 0 when none answered.
          example: 144
        avg_ring_seconds:
          type: integer
          description: Mean ring time over all matched calls.
          example: 20
        max_talk_seconds:
          type: integer
          description: Longest single conversation.
          example: 1260
    DialerDispositionTagList:
      type: object
      description: The company's disposition-tag catalogue. It uses the same envelope as the campaign list, but the catalogue is always returned whole, so `meta.nextCursor` is always null.
