  /dialer/campaigns/{campaignId}/statistics:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get a campaign's statistics
      description: 'Returns the campaign''s aggregated performance on one of two bases, told apart by `range` in the response:


        - **All-time** (no `dateFrom`/`dateTo`): lifetime counters served from a projection refreshed in the background — `updated_at` tells you how fresh they are, and `range` is null. `call_durations` is included only when `includeDurations=true` (it is the one read whose cost grows with the campaign).

        - **Ranged** (`dateFrom` and `dateTo` both set): counters aggregated at request time over the half-open window `[dateFrom, dateTo)`. `range` echoes the resolved window, `updated_at` is null, and durations are always included (`includeDurations` is ignored).


        Both bounds are RFC 3339 date-times. The service also reads the ISO 8601 date-only form `YYYY-MM-DD`, which lies outside that shape and is therefore only reachable from a client that does not validate against this schema: a date-only `dateTo` names a calendar day and is served inclusive of it — the exclusive end moves to the following UTC midnight, so equal date-only bounds are a valid one-day window. There is no limit on the window''s length; the only bound is the 13-month event retention horizon on `dateFrom`. Supplying only one bound, an empty window, or a `dateFrom` past the horizon is a 422.


        The membership-state blocks (`contact_states*`, `pending_by_category`, `open_assignments`) always describe the campaign''s current state — a window does not narrow them. Unknown query parameters are rejected with 400 rather than ignored. A campaign that has never been dialed returns zeroed counters, not 404.'
      operationId: publicGetCampaignStatistics
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      - name: dateFrom
        in: query
        required: false
        description: Inclusive lower bound of the statistics window, as an RFC 3339 date-time. Requires `dateTo`. Must not be older than the 13-month event retention horizon.
        schema:
          type: string
          format: date-time
        example: '2026-07-01T00:00:00.000Z'
      - name: dateTo
        in: query
        required: false
        description: Exclusive upper bound of the statistics window, as an RFC 3339 date-time. Requires `dateFrom`. A date-only value — which the `date-time` format does not admit, so only a client that does not validate against this schema sends one — is served inclusive of that day.
        schema:
          type: string
          format: date-time
        example: '2026-08-01T00:00:00.000Z'
      - name: includeDurations
        in: query
        required: false
        description: Set to `true` to include the `call_durations` block on an all-time read. Ignored on a ranged read, which always carries durations. Only the literal strings `true` and `false` are accepted — anything else is a 400.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The campaign's statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaignStatistics'
              example:
                campaign_id: '42'
                contact_states:
                  pending: 120
                  scheduled: 4
                  completed: 38
                  dnc: 2
                  exhausted: 1
                  excluded: 0
                contact_states_dialable:
                  pending: 118
                  scheduled: 4
                  completed: 38
                  dnc: 2
                  exhausted: 1
                  excluded: 0
                contact_states_repeated:
                  pending: 31
                  scheduled: 4
                  completed: 38
                  dnc: 2
                  exhausted: 1
                  excluded: 0
                pending_by_category:
                  favorite: 6
                  rescheduled: 12
                  retry: 22
                  fresh: 80
                total_contacts_at_range_end: 165
                open_assignments: 3
                assigned_by_state:
                  pending: 2
                  scheduled: 1
                assigned_pending_by_category:
                  favorite: 0
                  rescheduled: 0
                  retry: 1
                  fresh: 1
                total_dialed: 240
                total_answered: 150
                answer_rate: 0.625
                num_rescheduled: 12
                num_dropped: 3
                num_dispositioned: 96
                num_conversions: 30
                conversion_rate: 0.3125
                num_reached_human: 130
                num_reached_voicemail: 15
                num_reached_other_machine: 5
                attempt_no_split:
                  first_attempt: 152
                  repeat_attempt: 88
                distinct_called_contacts: null
                distinct_answered_contacts: 112
                call_durations:
                  calls: 238
                  answered_calls: 150
                  talk_seconds: 21540
                  total_seconds: 26310
                  ring_seconds: 4770
                  avg_talk_seconds: 144
                  avg_ring_seconds: 20
                  max_talk_seconds: 1260
                disposition_breakdown:
                - tag_id: '100'
                  count: 17
                  name: Interested
                  color: '#00AA55'
                  outcome: successful_positive
                - tag_id: '101'
                  count: 9
                  name: Call back later
                  color: '#FFAA00'
                  outcome: rescheduled
                updated_at: '2026-08-04T11:40:00.000Z'
                range: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
