          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: List surveys
      description: Returns the company's surveys newest first, cursor-paginated. List items are summaries carrying a `question_count` instead of the questions themselves — fetch one survey by id for the full definition. Archived surveys are hidden unless `include_archived=true`.
      operationId: publicListSurveys
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - name: cursor
        in: query
        required: false
        description: 'Opaque cursor taken from `meta.nextCursor` of a previous page. Pass it back unchanged. Omitting `cursor`, or sending it empty, starts from the first page — neither is an error. A non-empty cursor this endpoint cannot decode is rejected with `400` and `code: "PAGINATION.INVALID_CURSOR"` rather than silently restarting the list. Handle it as an error, not as a terminating `null` cursor: a loop that only stops on `null` would re-send the same rejected cursor. Drop the stored cursor and restart from a checkpoint you control.'
        schema:
          type: string
        example: eyJpZCI6IjQyIn0
      - name: limit
        in: query
        required: false
        description: Maximum number of items per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: include_archived
        in: query
        required: false
        description: Set to `true` to include archived items. Only the literal strings `true` and `false` are accepted — anything else is a 400.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: One page of survey summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerSurveyList'
              example:
                data:
                - id: '8'
                  name: Post-call qualification
                  is_archived: false
                  question_count: 1
                  created_at: '2026-07-01T09:00:00.000Z'
                  updated_at: '2026-08-04T11:40:00.000Z'
                meta:
                  nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
