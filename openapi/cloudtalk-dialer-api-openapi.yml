  /dialer/surveys/{surveyId}/questions:
    put:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Replace a survey's questions
      description: 'Atomically replaces the survey''s entire question set — this is a replace, not a merge. The body is the desired end state: existing questions (and their options) are deleted and the provided set is inserted in one transaction, ordered by `display_order`. `{"questions": []}` is valid and clears the survey. Question and option ids are server-generated — never send them; every replace mints new ids.


        Answers already collected are stored as immutable snapshots and are not rewritten by a replace.'
      operationId: publicReplaceSurveyQuestions
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerSurveyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerReplaceSurveyQuestionsRequest'
            example:
              questions:
              - label: Was the customer interested?
                type: radio
                is_required: true
                display_order: 0
                options:
                - label: 'Yes'
                  display_order: 0
                - label: 'No'
                  display_order: 1
              - label: Notes
                type: textarea
                is_required: false
                display_order: 1
      responses:
        '200':
          description: The survey definition with the replacement question set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerSurveyDefinition'
              example:
                id: '8'
                name: Post-call qualification
                is_archived: false
                questions:
                - id: '310'
                  label: Was the customer interested?
                  type: radio
                  is_required: true
                  display_order: 0
                  options:
                  - id: '901'
                    label: 'Yes'
                    display_order: 0
                  - id: '902'
                    label: 'No'
                    display_order: 1
                created_at: '2026-07-01T09:00:00.000Z'
                updated_at: '2026-08-04T11:40:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    dialerSurveyId:
      name: surveyId
      in: path
      required: true
      description: Survey ID (BIGINT serialized as string in responses; send the numeric value).
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      example: '8'
    dialerCampaignContactId:
      name: campaignContactId
      in: path
      required: true
      description: Campaign-contact (membership) ID — `campaign_contact_id` from the contacts list, not the contact's own id.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      example: '5100'
    dialerScriptId:
      name: scriptId
      in: path
      required: true
      description: Script ID (BIGINT serialized as string in responses; send the numeric value).
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      example: '17'
    dialerExportJobId:
      name: jobId
      in: path
      required: true
      description: Export job ID returned by the export enqueue call.
      schema:
        type: string
        format: uuid
    dialerCampaignId:
      name: campaignId
      in: path
      required: true
      description: Dialer campaign ID.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
  schemas:
    DialerDispositionBreakdownEntry:
      type: object
      description: How often one disposition tag was recorded. Labels are null when the tag cannot be resolved.
      properties:
        tag_id:
          type: string
          description: Call-tag ID.
          example: '100'
        count:
          type: integer
          description: Times this disposition was recorded.
          example: 17
        name:
          type:
          - string
          - 'null'
          description: Tag display name; null when unresolvable.
          example: Interested
        color:
          type:
          - string
          - 'null'
          description: Tag display colour; null when unresolvable.
          example: '#00AA55'
        outcome:
          type:
          - string
          - 'null'
          description: Tag outcome classification; null when unresolvable.
          example: successful_positive
    DialerAgentPermissions:
      type: object
      description: Booleans gating what an agent may do to their queue. Deny by default — an omitted key is false.
      properties:
        skip:
          type: boolean
          description: Agent may skip the contact currently served to them.
          example: true
        remove:
          type: boolean
          description: Agent may remove a contact from the campaign queue.
          example: false
        reorder:
          type: boolean
          description: Agent may reorder their own queue.
          example: false
    DialerCampaignContactList:
      type: object
      description: One cursor page of campaign contacts, ordered by dialing eligibility.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DialerCampaignContact'
        meta:
          $ref: '#/components/schemas/DialerCampaignContactMeta'
    DialerExportJobStatus:
      type: object
      description: State of an export job. Once it reports `completed`, fetch the file through the export-download call — a pre-signed link is also emailed to the requester.
      properties:
        jobId:
          type: string
          description: Export job ID.
          format: uuid
          example: 0197fbd1-6d0a-7e58-8f6f-1a2b3c4d5e6f
        status:
          type: string
          description: Job status. `queued` → `running` → `completed` | `failed`.
          enum:
          - queued
          - running
          - completed
          - failed
          example: running
        progress:
          $ref: '#/components/schemas/DialerExportProgress'
        createdAt:
          type: string
          description: When the job was enqueued (ISO 8601, UTC).
          format: date-time
          example: '2026-08-04T08:00:00.000Z'
        completedAt:
          type:
          - string
          - 'null'
          description: When the job finished; null while it is still queued or running.
          format: date-time
          example: '2026-08-04T08:05:00.000Z'
    DialerCreateCampaignRequest:
      type: object
      description: Body of the campaign create call. Only `name` and `mode` are required; every policy bundle falls back to the service default when omitted.
      required:
      - name
      - mode
      properties:
        name:
          type: string
          description: Human-readable campaign name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Q3 renewals
        mode:
          type: string
          description: Dialing mode. `sequential` dials one number at a time per agent; `parallel` dials several.
          enum:
          - sequential
          - parallel
          example: sequential
        calling_policy:
          $ref: '#/components/schemas/DialerCallingPolicy'
        queue_policy:
          $ref: '#/components/schemas/DialerQueuePolicy'
        retry_policy:
          $ref: '#/components/schemas/DialerRetryPolicy'
        schedule_policy:
          $ref: '#/components/schemas/DialerSchedulePolicy'
        ttl_policy:
          $ref: '#/components/schemas/DialerTtlPolicy'
        waterfall_order:
          type: array
          description: Ordered, duplicate-free subset of the waterfall categories. Contacts are served tier by tier in this order.
          items:
            type: string
            enum:
            - favorite
            - rescheduled
            - retry
            - fresh
          example:
          - favorite
          - rescheduled
          - retry
          - fresh
        agent_permissions:
          $ref: '#/components/schemas/DialerAgentPermissions'
        call_script_id:
          type:
          - integer
          - 'null'
          description: Call script to link to the campaign; omit it or send `null` to create the campaign without a linked call script. Sent as an integer in requests; responses return the id as a string.
          minimum: 1
          example: 310
        survey_id:
          type:
          - integer
          - 'null'
          description: Survey to link to the campaign; omit it or send `null` to create the campaign without a linked survey. Sent as an integer in requests; responses return the id as a string.
          minimum: 1
          example: 44
    DialerCreateExportRequest:
      type: object
      description: Body of the export enqueue call.
      required:
      - type
      - format
      properties:
        type:
          type: string
          description: What to export. `call_history` exports the campaign's dial log; `survey_responses` exports answers collected by the campaign's survey.
          enum:
          - call_history
          - survey_responses
          example: call_history
        format:
          type: string
          description: Serialisation format of the generated file.
          enum:
          - csv
          - xlsx
          example: csv
        filters:
          $ref: '#/components/schemas/DialerExportFilters'
    DialerDispositionTag:
      type: object
      description: One call tag usable as a campaign disposition button.
      properties:
        id:
          type: string
          description: Tag ID — pass this as `tag_id` when configuring disposition buttons.
          example: '100'
        name:
          type: string
          description: Tag display name.
          example: Interested
        color:
          type:
          - string
          - 'null'
          description: Tag display colour; null when unset.
          example: '#00AA55'
        outcome:
          type: string
          description: Outcome classification carried by the tag.
          example: successful_positive
    DialerCampaign:
      type: object
      description: A dialer campaign. Identifiers are returned as strings because they are 64-bit integers server-side.
      properties:
        id:
          type: string
          description: Campaign ID.
          example: '42'
        name:
          type: string
          description: Human-readable campaign name.
          example: Q3 renewals
        mode:
          type: string
          description: Dialing mode.
          enum:
          - sequential
          - parallel
          example: sequential
        status:
          type: string
          description: 'Lifecycle status. `initializing`: created, membership backfill pending. `active`: the only dialable state. `inactive`: paused, fully reversible. `archived`: review/analytics state, not dialable, exits only back to `inactive`. `deleted`: soft-deleted, terminal.'
          enum:
          - initializing
          - active
          - inactive
          - archived
          - deleted
          example: active
        calling_policy:
          $ref: '#/components/schemas/DialerCallingPolicy'
        queue_policy:
          $ref: '#/components/schemas/DialerQueuePolicy'
        retry_policy:
          $ref: '#/components/schemas/DialerRetryPolicy'
        schedule_policy:
          $ref: '#/components/schemas/DialerSchedulePolicy'
        ttl_policy:
          $ref: '#/components/schemas/DialerTtlPolicy'
        waterfall_order:
          type: array
          description: Ordered, duplicate-free subset of the waterfall categories.
          items:
            type: string
            enum:
            - favorite
            - rescheduled
            - retry
            - fresh
          example:
          - favorite
          - rescheduled
          - retry
          - fresh
        agent_permissions:
          $ref: '#/components/schemas/DialerAgentPermissions'
        call_script_id:
          type:
          - string
          - 'null'
          description: Linked call-script ID; null when none.
          example: '310'
        survey_id:
          type:
          - string
          - 'null'
          description: Linked survey ID; null when none.
          example: '44'
        created_at:
          type: string
          description: Creation timestamp (ISO 8601, UTC).
          format: date-time
          example: '2026-08-01T09:15:00.000Z'
        updated_at:
          type: string
          description: Last-update timestamp (ISO 8601, UTC).
          format: date-time
          example: '2026-08-04T11:42:07.000Z'
        archived_at:
          type:
          - string
          - 'null'
          description: When the campaign entered `archived`; cleared on exit, so non-null only while the status is `archived`.
          format: date-time
          example: null
        deleted_at:
          type:
          - string
          - 'null'
          description: Soft-delete timestamp; null unless the campaign has been deleted.
          format: date-time
          example: null
    DialerQueuePolicy:
      type: object
      description: Allocation-batch and dynamic queue-sizing bundle. Every knob is optional.
      properties:
        lock_size:
          type: integer
          description: How many contacts an agent may hold allocated at once.
          minimum: 0
          example: 5
        pinned_callback_hold_ms:
          type: integer
          description: Hold window (ms) past an agent-pinned callback's due time after which any agent may serve it; 0 releases the pin as soon as the callback is overdue.
          minimum: 0
          example: 300000
        refill_amount:
          type: integer
          description: How many contacts are pulled per queue refill.
          minimum: 0
          example: 3
        sizing_mode:
          type: string
          description: Queue-sizing strategy (static or agent-count driven).
          example: dynamic
        min:
          type: integer
          description: Lower bound on the dynamically sized queue.
          minimum: 0
          example: 10
        max:
          type: integer
          description: Upper bound on the dynamically sized queue.
          minimum: 0
          example: 200
        multiplier:
          type: number
          description: Queue size per available agent when sizing dynamically.
          minimum: 0
          example: 2.5
        threshold:
          type: integer
          description: Remaining-contact count that triggers a refill.
          minimum: 0
          example: 5
        manual_refill:
          type: boolean
          description: When true the queue is only refilled on an explicit agent action.
          example: false
    DialerCreateScriptRequest:
      type: object
      required:
      - name
      - body
      description: Body of the create-script call. Unknown fields are silently dropped.
      properties:
        name:
          type: string
          description: Display name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Summer promo pitch
        body:
          type: string
          description: Script content; supports `{{merge}}` fields.
          minLength: 1
          example: Hi {{first_name}}…
    DialerReplaceSurveyQuestionsRequest:
      type: object
      required:
      - questions
      description: Body of the replace-questions call — the desired end state of the survey's question set. An empty array clears the survey.
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/DialerSurveyQuestionInput'
    DialerScript:
      type: object
      description: A call script agents read while dialing. Ids are BIGINTs serialized as strings.
      properties:
        id:
          type: string
          description: Script ID.
          example: '17'
        name:
          type: string
          description: Display name.
          maxLength: 255
          example: Summer promo pitch
        body:
          type: string
          description: Script content; supports `{{merge}}` fields resolved by the agent's phone at call time.
          example: Hi {{first_name}}, this is {{agent_name}} from CloudTalk…
        is_archived:
          type: boolean
          description: Whether the script is archived (soft-deleted).
          example: false
        created_at:
          type: string
          description: When the script was created (ISO 8601, UTC).
          format: date-time
          example: '2026-07-01T09:00:00.000Z'
        updated_at:
          type: string
          description: When the script last changed (ISO 8601, UTC).
          format: date-time
          example: '2026-08-04T11:40:00.000Z'
    DialerSurveyList:
      type: object
      description: One cursor page of survey summaries.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DialerSurveySummary'
        meta:
          $ref: '#/components/schemas/DialerCursorMeta'
    DialerSurveySummary:
      type: object
      description: List item of the surveys collection — a summary carrying `question_count` instead of the questions themselves.
      properties:
        id:
          type: string
          description: Survey ID.
          example: '8'
        name:
          type: string
          description: Display name.
          example: Post-call qualification
        is_archived:
          type: boolean
          description: Whether the survey is archived.
          example: false
        question_count:
          type: integer
          description: Number of questions the survey currently has.
          example: 1
        created_at:
          type: string
          description: When the survey was created (ISO 8601, UTC).
          format: date-time
          example: '2026-07-01T09:00:00.000Z'
        updated_at:
          type: string
          description: When the survey last changed (ISO 8601, UTC).
          format: date-time
          example: '2026-08-04T11:40:00.000Z'
    DialerDispositionButtonInput:
      type: object
      description: One disposition button in the replace-all body. The button's display name and colour are not set here — they come from the referenced tag.
      required:
      - tag_id
      - outcome_kind
      properties:
        tag_id:
          type: integer
          description: Referenced call-tag id. List the available tags with the disposition-tags call. Sent as an integer in requests; responses return the id as a string.
          minimum: 1
          example: 100
        outcome_kind:
          type: string
          description: How the dialer treats a call dispositioned with this button.
          enum:
          - successful_positive
          - successful_negative
          - rescheduled
          - unsuccessful_call_again
          - unsuccessful_do_not_call
          example: successful_positive
        display_order:
          type: integer
          description: Ascending display position; defaults to 0.
          minimum: 0
          example: 1
        color:
          not: {}
          description: Not supported — any supplied value (including `null`) is rejected with 400. The button's colour always comes from the referenced tag. Other unknown keys are silently ignored.
    DialerSurveyQuestion:
      type: object
      description: One question of a survey. Ids are server-generated and change on every question replace.
      properties:
        id:
          type: string
          description: Question ID.
          example: '310'
        label:
          type: string
          description: Question text shown to the agent.
          maxLength: 1000
          example: Was the customer interested?
        type:
          type: string
          description: Input widget the agent answers with.
          enum:
          - text
          - textarea
          - radio
          - checkbox
          - select
          example: radio
        is_required:
          type: boolean
          description: Whether the agent must answer before submitting.
          example: true
        display_order:
          type: integer
          description: Zero-based position among the survey's questions.
          minimum: 0
          example: 0
        options:
          type: array
          description: Choices for choice-type questions. Accepted and stored for any question type.
          items:
            $ref: '#/components/schemas/DialerSurveyOption'
    DialerCampaignContactMeta:
      type: object
      description: Pagination block of the campaign-contacts list. Unlike the other dialer lists it carries `total`.
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page; null on the last page.
          example: null
        total:
          type: integer
          description: Size of the filtered set — moves with `queueTag` and `search`.
          example: 1
    DialerExportProgress:
      type: object
      description: Coarse progress hint. Both counters stay at 0 until the runner picks the job up.
      properties:
        currentPartition:
          type: integer
          description: Partition the runner is currently streaming.
          example: 3
        totalPartitions:
          type: integer
          description: Partitions the job has to stream in total.
          example: 8
    DialerRetryPolicy:
      type: object
      description: Re-dial rules bundle. Every knob is optional.
      properties:
        max_attempts:
          type: integer
          description: Maximum dial attempts per contact before it is exhausted.
          minimum: 0
          example: 3
        interval_hours:
          type: number
          description: Hours to wait between attempts; 0 retries immediately.
          minimum: 0
          example: 24
        excluded_dispositions:
          type: array
          description: Disposition outcomes that stop further retries.
          items:
            type: string
          example:
          - unsuccessful_do_not_call
        dnc_tag_ids:
          type: array
          description: Contact-tag ids that mark a contact as do-not-call.
          items:
            type: integer
            minimum: 0
          example:
          - 55
    DialerError:
      type: object
      description: Error envelope returned by every Dialer API endpoint. Note it differs from the legacy API's error format.
      properties:
        statusCode:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error message
        error:
          type: string
          description: HTTP error name
        correlationId:
          type: string
          description: Request correlation ID — include it when contacting support
          example: YevPQs
        subErrors:
          type: array
          items:
            type: string
          description: Field-level validation messages, present on validation failures
          example:
          - incorrect email
      required:
      - statusCode
      - message
      - error
      - correlationId
    DialerContactStateCounts:
      type: object
      description: Contact counts per campaign-membership state.
      properties:
        pending:
          type: integer
          description: Not yet attempted or awaiting a retry.
          example: 120
        scheduled:
          type: integer
          description: Has a scheduled callback.
          example: 4
        completed:
          type: integer
          description: Reached a final disposition.
          example: 38
        dnc:
          type: integer
          description: Marked do-not-call.
          example: 2
        exhausted:
          type: integer
          description: Ran out of retry attempts.
          example: 1
        excluded:
          type: integer
          description: Excluded from the campaign by configuration.
          example: 0
    DialerExportDownload:
      type: object
      description: A pre-signed download link for a completed export. Minted fresh on every call; valid at least 60 minutes.
      properties:
        url:
          type: string
          description: Pre-signed S3 URL of the export file. Fetch it without credentials — the signature is the authorization.
          example: https://ct-dialer-exports.s3.eu-west-1.amazonaws.com/exports/700001/0197fbd1-6d0a-7e58-8f6f-1a2b3c4d5e6f/call_history-campaign-42.csv?X-Amz-Signature=…
        expiresAt:
          type: string
          description: Instant the URL stops working (ISO 8601, UTC). Call the endpoint again for a fresh link.
          format: date-time
          example: '2026-08-04T09:05:00.000Z'
    DialerTargetTagAssociation:
      type: object
      description: One target-tag association, with its serving rank and provenance.
      properties:
        ref_id:
          type: integer
          description: Referenced contact-tag id.
          example: 10
        priority:
          type: integer
          description: Serving rank — the highest priority is served first.
          example: 10
        label:
          type:
          - string
          - 'null'
          description: Human-readable level name; null when unset.
          example: Hot
        origin:
          type: string
          description: Read-only provenance. `manual` rows were added through this endpoint; `crm_connection` rows are kept in sync by a campaign CRM connection and can only be re-ranked here, not added or removed.
          enum:
          - manual
          - crm_connection
          example: manual
    DialerPatchSurveyRequest:
      type: object
      description: Body of the patch-survey call. Only these two fields are patchable — questions change through the replace-questions call.
      properties:
        name:
          type: string
          description: New display name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Post-call qualification v2
        is_archived:
          type: boolean
          description: '`true` archives the survey (its soft delete), `false` restores it.'
          example: true
    DialerPatchCampaignRequest:
      type: object
      description: Body of the campaign update call. Every key is optional — an omitted key is left unchanged. `status` drives the lifecycle transition; `deleted` is never a valid target here (use the delete call).
      properties:
        name:
          type: string
          description: Human-readable campaign name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Q3 renewals — EMEA
        mode:
          type: string
          description: Dialing mode.
          enum:
          - sequential
          - parallel
          example: parallel
        status:
          type: string
          description: 'Target lifecycle status. Legal transitions: `initializing` → `active` | `archived`; `active` ↔ `inactive`; `active` → `archived`; `inactive` → `archived`; `archived` → `inactive`. A patch that leaves the status unchanged is a no-op. `deleted` passes schema validation but is always rejected with 422 — only the delete call sets it.'
          enum:
          - initializing
          - active
          - inactive
          - archived
          - deleted
          example: active
        calling_policy:
          $ref: '#/components/schemas/DialerCallingPolicy'
        queue_policy:
          $ref: '#/components/schemas/DialerQueuePolicy'
        retry_policy:
          $ref: '#/components/schemas/DialerRetryPolicy'
        schedule_policy:
          $ref: '#/components/schemas/DialerSchedulePolicy'
        ttl_policy:
          $ref: '#/components/schemas/DialerTtlPolicy'
        waterfall_order:
          type: array
          description: Ordered, duplicate-free subset of the waterfall categories. Contacts are served tier by tier in this order.
          items:
            type: string
            enum:
            - favorite
            - rescheduled
            - retry
            - fresh
          example:
          - favorite
          - rescheduled
          - retry
          - fresh
        agent_permissions:
          $ref: '#/components/schemas/DialerAgentPermissions'
        call_script_id:
          type:
          - integer
          - 'null'
          description: Call script to link to the campaign; `null` clears the link, an omitted key leaves it unchanged. Sent as an integer in requests; responses return the id as a string.
          minimum: 1
          example: 310
        survey_id:
          type:
          - integer
          - 'null'
          description: Survey to link to the campaign; `null` clears the link, an omitted key leaves it unchanged. Sent as an integer in requests; responses return the id as a string.
          minimum: 1
          example: 44
    DialerSurveyOption:
      type: object
      description: One choice of a `radio`, `checkbox` or `select` question. Ids are server-generated.
      properties:
        id:
          type: string
          description: Option ID.
          example: '901'
        label:
          type: string
          description: Choice label shown to the agent.
          maxLength: 500
          example: 'Yes'
        display_order:
          type: integer
          description: Zero-based position among the question's options.
          minimum: 0
          example: 0
    DialerAttemptNoSplit:
      type: object
      description: Attempts split by whether they were the contact's first attempt or a repeat.
      properties:
        first_attempt:
          type: integer
          description: Attempts that were a contact's first.
