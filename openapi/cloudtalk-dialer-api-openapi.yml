openapi: 3.2.0
info:
  title: CloudTalk Dialer API
  description: '# Introduction

    Welcome to CloudTalk API reference! Many of these businesses use the CloudTalk API to automate and enhance their customer support with CloudTalk Support. With CloudTalk we are re-building telco industry from the ground and taking it to the next level with first-class customer support system. Please find below the full documenation to CloudTalk. # API Overview


    The API is organized around the following resources:


    API Area | Description

    ----------------|-------------

    Calls | Browse your call history, download recordings and access all your calls data. Contacts | Create and update Contacts. Use filters to get lists of Contacts, or access their profiles individually. Numbers | Automate Numbers modifications. List all your numbers. Agents | Create or update your Agents, access their settings. Conversation Intelligence | Get Conversation Intelligence data about your calls. VoiceAgent | Initiate VoiceAgent calls


    JSON is returned in all responses. XML is not supported. The API also uses common approaches for the following:


    Function | Description

    ----------------|-------------

    Data | API data is JSON encoded with UTF-8. API JSON is either a single object or a list of objects. Errors | 4xx and 5xx responses returning JSON with error codes

    Rate Limiting | Controls how many requests can be made in a time window

    HTTP | Methods are used in accordance with HTTP (GET POST and DELETE are the primary methods used) and resources are identified using URIs. All API requests are sent over HTTPS. ## Authentication


    This is an HTTPS-only API. Authentication is based on API Access Key ID and Access Key Secret. The API Access Key ID and Access Key Secret is passed via HTTP Basic Authentication. Basic Auth credentials are used to determine on which project should this request be executed on. List of all Basic Auth credentials for the project can be found by Administrators in the CloudTalk Dashboard under Account → Settings → API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys). To try the API via curl on the command-line, the general form used would be:

    ```

    curl -u ACCESS_KEY_ID:ACCESS_KEY_SECRET API_URL

    ```


    For instance, you would execute:

    ```

    curl -u ABCDEFGHIJTESTKEY1:X05Dg4c331c3h61An https://my.cloudtalk.io/api/calls/index.json

    ```


    ## Usage


    The API may rate limit submission of requests for your application. Such limits are managed as an allowed number of operations per time window, where an operation might be read or an update. In that case a **''429 Too Many Requests''** response code will be returned along with the following headers -


    Header name | Description

    ----------------|-------------

    X-CloudTalkAPI-Limit | Maximum number of API requests allowed in the current time window. X-CloudTalkAPI-Remaining | Number of API requests left in the current window. X-CloudTalkAPI-ResetTime | Time when rate limit window will be reset as a Unix timestamp. Note that the default rate limit is **60 operations per minute per company**. If you need to make more requests, please contact our support with detailed explanation of your use case. ## Response Envelopes


    **Note:** Conversation Intelligence doesn''t follow envelopes. The API returns one of three envelopes depending upon the request issued:


    1. Single Item Envelope

    2. Collections Envelope

    3. Error Envelope


    ### Single Item Envelope


    All dates/times are returned in ISO8601 format and in UTC timezone. ```

    Status: 200 OK

    {

    "responseData": {

    "id": 123,

    ... "created": "2018-01-10 12:34:56"

    }

    }

    ```


    ### Collections Envelope


    All dates/times are returned in ISO8601 format and in UTC timezone. ```

    Status: 200 OK

    {

    "responseData": {

    "itemsCount": 65,

    "pageCount": 3,

    "pageNumber": 1,

    "limit": 30,

    "data": [

    {

    "id": 123,

    ... "created": "2018-01-10 12:34:56"

    },

    {

    "id": 456,

    ... "created": "2017-10-19 09:21:29"

    },

    ...'
  contact:
    name: CloudTalk API Support
    url: https://www.cloudtalk.io/contact
  version: '1.7'
  x-logo:
    url: https://my.cloudtalk.io/img/logo-cloudtalk-color.png
servers:
- url: https://my.cloudtalk.io/api
security:
- basicAuth: []
tags:
- name: Dialer
  description: 'Partner API for the CloudTalk sales dialer — campaigns, campaign contacts, call scripts, surveys, disposition buttons, statistics and data exports.


    The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard. The legacy campaigns API under `/campaigns` is a different product and is not affected.


    Authentication is the same HTTP Basic scheme as the rest of the API — your API Access Key ID as the username and API Access Key Secret as the password. This surface differs from the rest of the CloudTalk API in three ways:


    - **Base URL** `https://api.cloudtalk.io/v1` (not `my.cloudtalk.io/api`).

    - **Responses** never use the `responseData` envelope: list endpoints return `{ data, meta }` with cursor pagination (`meta.nextCursor` — pass it back as `cursor` to page forward), single resources return the object directly, and some sub-collections return plain arrays.

    - **Errors** return `{ statusCode, message, error, correlationId, subErrors? }` — except `401`, which is answered by the authentication layer in front of the host as `{ code, message }`. Quote the `correlationId` when contacting support.


    Rate limiting is per company in a dedicated budget of 60 requests per minute, separate from the core API''s quota.'
paths:
  /dialer/campaigns:
    post:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Create a dialer campaign
      description: 'Creates a campaign in the `initializing` state: the contact membership defined by its target tags is built asynchronously, after which the campaign can be moved to `active`. Only `name` and `mode` are required — every policy bundle falls back to the service default when omitted. Target tags, queue groups and agents are attached separately with the associations call.'
      operationId: publicCreateCampaign
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerCreateCampaignRequest'
            example:
              name: Q3 renewals
              mode: sequential
              calling_policy:
                answer_wait: 25
                after_call: 10
                recording: true
              queue_policy:
                lock_size: 5
                refill_amount: 3
              retry_policy:
                max_attempts: 3
                interval_hours: 24
              waterfall_order:
              - favorite
              - rescheduled
              - retry
              - fresh
              agent_permissions:
                skip: true
              call_script_id: 310
      responses:
        '201':
          description: The created campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaign'
              example:
                id: '42'
                name: Q3 renewals
                mode: sequential
                status: initializing
                calling_policy:
                  answer_wait: 25
                  after_call: 10
                  recording: true
                queue_policy:
                  lock_size: 5
                  refill_amount: 3
                retry_policy:
                  max_attempts: 3
                  interval_hours: 24
                schedule_policy:
                  start_date: '2026-08-10'
                  start_time: 09:00
                ttl_policy:
                  mode: campaign
                  hours: 72
                waterfall_order:
                - favorite
                - rescheduled
                - retry
                - fresh
                agent_permissions:
                  skip: true
                  remove: false
                  reorder: false
                call_script_id: '310'
                survey_id: null
                created_at: '2026-08-01T09:15:00.000Z'
                updated_at: '2026-08-01T09:15:00.000Z'
                archived_at: null
                deleted_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: List dialer campaigns
      description: Returns the company's campaigns newest first, cursor-paginated. Pass `meta.nextCursor` from a page back as `cursor` to fetch the following page; a null `nextCursor` means there are no more pages. Deleted campaigns are hidden unless `include_deleted=true`; pass `status=deleted` to list only them. When `status` is set, `include_deleted` has no effect.
      operationId: publicListCampaigns
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - name: cursor
        in: query
        required: false
        description: 'Opaque cursor taken from `meta.nextCursor` of a previous page. Pass it back unchanged. Omitting `cursor`, or sending it empty, starts from the first page — neither is an error. A non-empty cursor this endpoint cannot decode is rejected with `400` and `code: "PAGINATION.INVALID_CURSOR"` rather than silently restarting the list. Handle it as an error, not as a terminating `null` cursor: a loop that only stops on `null` would re-send the same rejected cursor. Drop the stored cursor and restart from a checkpoint you control.'
        schema:
          type: string
        example: eyJpZCI6IjQyIn0
      - name: limit
        in: query
        required: false
        description: Maximum number of campaigns per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        description: Return only campaigns in this lifecycle status.
        schema:
          type: string
          enum:
          - initializing
          - active
          - inactive
          - archived
          - deleted
      - name: include_deleted
        in: query
        required: false
        description: Set to `true` to include campaigns whose status is `deleted`, which are hidden by default. Ignored when `status` is set. Only the literal strings `true` and `false` are accepted — anything else is a 400.
        schema:
          type: boolean
          default: false
      - name: mode
        in: query
        required: false
        description: Return only campaigns using this dialing mode.
        schema:
          type: string
          enum:
          - sequential
          - parallel
      responses:
        '200':
          description: One page of campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaignList'
              example:
                data:
                - id: '42'
                  name: Q3 renewals
                  mode: sequential
                  status: active
                  calling_policy:
                    answer_wait: 25
                    after_call: 10
                    recording: true
                  queue_policy:
                    lock_size: 5
                    refill_amount: 3
                  retry_policy:
                    max_attempts: 3
                    interval_hours: 24
                  schedule_policy:
                    start_date: '2026-08-10'
                    start_time: 09:00
                  ttl_policy:
                    mode: campaign
                    hours: 72
                  waterfall_order:
                  - favorite
                  - rescheduled
                  - retry
                  - fresh
                  agent_permissions:
                    skip: true
                    remove: false
                    reorder: false
                  call_script_id: '310'
                  survey_id: null
                  created_at: '2026-08-01T09:15:00.000Z'
                  updated_at: '2026-08-04T11:42:07.000Z'
                  archived_at: null
                  deleted_at: null
                meta:
                  nextCursor: eyJpZCI6IjQyIn0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/campaigns/{campaignId}:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get a dialer campaign
      description: Returns a single campaign with its full configuration. A campaign belonging to another company reads as 404.
      operationId: publicGetCampaign
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaign'
              example:
                id: '42'
                name: Q3 renewals
                mode: sequential
                status: active
                calling_policy:
                  answer_wait: 25
                  after_call: 10
                  recording: true
                queue_policy:
                  lock_size: 5
                  refill_amount: 3
                retry_policy:
                  max_attempts: 3
                  interval_hours: 24
                schedule_policy:
                  start_date: '2026-08-10'
                  start_time: 09:00
                ttl_policy:
                  mode: campaign
                  hours: 72
                waterfall_order:
                - favorite
                - rescheduled
                - retry
                - fresh
                agent_permissions:
                  skip: true
                  remove: false
                  reorder: false
                call_script_id: '310'
                survey_id: null
                created_at: '2026-08-01T09:15:00.000Z'
                updated_at: '2026-08-04T11:42:07.000Z'
                archived_at: null
                deleted_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Update a dialer campaign
      description: 'Partially updates the campaign''s configuration and/or moves it through its lifecycle. Every key is optional and an omitted key is left unchanged; a supplied policy bundle replaces that bundle wholesale. Legal `status` transitions: `initializing` → `active` | `archived`; `active` ↔ `inactive`; `active` → `archived`; `inactive` → `archived`; `archived` → `inactive`. An illegal transition — including `deleted`, which only the delete call may set — returns 422. Status changes never conflict with running work: in-flight dialing sessions drain naturally once the status is no longer `active`.'
      operationId: publicPatchCampaign
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerPatchCampaignRequest'
            example:
              status: active
              retry_policy:
                max_attempts: 5
                interval_hours: 12
      responses:
        '200':
          description: The updated campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerCampaign'
              example:
                id: '42'
                name: Q3 renewals
                mode: sequential
                status: active
                calling_policy:
                  answer_wait: 25
                  after_call: 10
                  recording: true
                queue_policy:
                  lock_size: 5
                  refill_amount: 3
                retry_policy:
                  max_attempts: 3
                  interval_hours: 24
                schedule_policy:
                  start_date: '2026-08-10'
                  start_time: 09:00
                ttl_policy:
                  mode: campaign
                  hours: 72
                waterfall_order:
                - favorite
                - rescheduled
                - retry
                - fresh
                agent_permissions:
                  skip: true
                  remove: false
                  reorder: false
                call_script_id: '310'
                survey_id: null
                created_at: '2026-08-01T09:15:00.000Z'
                updated_at: '2026-08-04T11:42:07.000Z'
                archived_at: null
                deleted_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Delete a dialer campaign
      description: 'Soft-deletes the campaign: its status becomes `deleted` (terminal) and its deletion is timestamped. It stops being dialable and drops out of the default campaign list — `GET /dialer/campaigns` returns it only with `include_deleted=true` or `status=deleted`. Allowed from any status and idempotent — repeating the call on an already-deleted campaign is a no-op. Returns 409 only while the campaign still has active dialing sessions; end those and retry. Nothing is erased, so historical statistics and exports stay available.'
      operationId: publicDeleteCampaign
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/campaigns/{campaignId}/associations:
    put:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Replace a campaign's associations
      description: 'Replaces every association of the campaign in one call: the contact tags that define its membership (`target_tag`), the queue groups it draws agents from (`queue_group`), and the individually assigned agents (`agent`). Each array is optional and defaults to empty, so an omitted kind clears that kind. Entries can be given as objects or as bare ids — `[10, 11]` is shorthand for `[{ "ref_id": 10 }, { "ref_id": 11 }]`.


        `priority` and `label` rank a target tag (highest priority served first) and are only valid on `target_tag` entries — sending them on a queue group or agent returns 422. Naming the same `(kind, ref_id)` twice in one body returns 409 and nothing is written. A target tag owned by a CRM connection can be re-ranked here, but adding or removing it stays with the connection that owns it; leaving it out of the body does not remove it.


        Every `ref_id` is a weak reference: this call does not check that a contact tag, queue group or agent with that id exists. A nonexistent target tag is stored and simply contributes no contacts, so validate the ids on your side before sending them.'
      operationId: publicReplaceCampaignAssociations
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerReplaceAssociationsRequest'
            example:
              target_tag:
              - ref_id: 10
                priority: 10
                label: Hot
              - 11
              queue_group:
              - 20
              agent:
              - 800001
      responses:
        '200':
          description: The campaign's associations after the replace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerAssociations'
              example:
                target_tag:
                - ref_id: 10
                  priority: 10
                  label: Hot
                  origin: manual
                - ref_id: 11
                  priority: 0
                  label: null
                  origin: manual
                - ref_id: 12
                  priority: 5
                  label: HubSpot list
                  origin: crm_connection
                queue_group:
                - 20
                agent:
                - 800001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get a campaign's associations
      description: Returns the campaign's associations grouped by kind. Target tags carry their serving `priority`, their `label` and their read-only `origin` provenance; queue groups and agents are returned as plain id arrays.
      operationId: publicGetCampaignAssociations
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      responses:
        '200':
          description: The campaign's associations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerAssociations'
              example:
                target_tag:
                - ref_id: 10
                  priority: 10
                  label: Hot
                  origin: manual
                - ref_id: 11
                  priority: 0
                  label: null
                  origin: manual
                - ref_id: 12
                  priority: 5
                  label: HubSpot list
                  origin: crm_connection
                queue_group:
                - 20
                agent:
                - 800001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/campaigns/{campaignId}/disposition-buttons:
    put:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Replace a campaign's disposition buttons
      description: 'Replaces the campaign''s whole disposition-button set — the buttons an agent picks from to close a call. Each button references a call tag by `tag_id` (list them with the disposition-tags call) and declares the `outcome_kind` that tells the dialer what to do next (retry, reschedule, stop calling, …). An empty `buttons` array clears the set.


        The button''s display name and colour are always taken from the referenced tag, so a `color` key in the body is rejected with 400 rather than silently ignored. An `outcome_kind` outside the listed values is a schema violation and returns 400. Referencing the same tag twice returns 409, and a `tag_id` that is not an active call tag on your account — unknown, deleted or archived — returns 422.'
      operationId: publicReplaceCampaignDispositionButtons
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerReplaceDispositionButtonsRequest'
            example:
              buttons:
              - tag_id: 101
                outcome_kind: rescheduled
                display_order: 0
              - tag_id: 100
                outcome_kind: successful_positive
                display_order: 1
      responses:
        '200':
          description: The campaign's disposition buttons after the replace, ordered by `display_order`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DialerDispositionButton'
              example:
              - id: '15'
                tag_id: '101'
                outcome_kind: rescheduled
                color: '#FFAA00'
                display_order: 0
                name: Call back later
                outcome: rescheduled
              - id: '16'
                tag_id: '100'
                outcome_kind: successful_positive
                color: '#00AA55'
                display_order: 1
                name: Interested
                outcome: successful_positive
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get a campaign's disposition buttons
      description: 'Returns the campaign''s disposition buttons as a plain array ordered by `display_order`, with each button''s name, colour and outcome resolved from its referenced call tag.


        A button whose call tag has since been deleted or archived on your account is left out of the response — removing a disposition removes it from every campaign. If the call tags cannot be read at that moment, every button is returned instead, with `name`, `color` and `outcome` set to null.'
      operationId: publicGetCampaignDispositionButtons
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      responses:
        '200':
          description: The campaign's disposition buttons, ordered by `display_order`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DialerDispositionButton'
              example:
              - id: '15'
                tag_id: '101'
                outcome_kind: rescheduled
                color: '#FFAA00'
                display_order: 0
                name: Call back later
                outcome: rescheduled
              - id: '16'
                tag_id: '100'
                outcome_kind: successful_positive
                color: '#00AA55'
                display_order: 1
                name: Interested
                outcome: successful_positive
        '401':
          $ref: '#/components/responses/Unauthorized'
