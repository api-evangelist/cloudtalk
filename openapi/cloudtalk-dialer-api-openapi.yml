  /dialer/campaigns/{campaignId}/exports:
    post:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Request a campaign data export
      description: 'Queues an asynchronous export of the campaign''s call history or survey responses as CSV or XLSX and returns immediately with a job handle — nothing is generated during the request. Poll the job with the export-status call.


        When the job completes, fetch the file through the export-download call, which mints a pre-signed link; the same link is also emailed to the requester. Optional `filters` narrow the export by contact, agent or date range — omit them to export everything for the campaign.


        The call is not idempotent: every request enqueues a new job, so a retry after a timeout creates a second export and a second link. There is no deduplication window or idempotency key.


        `filters.contactId` and `filters.userId` must be positive ids, and `dateFrom` / `dateTo` must be strict ISO 8601 — anything else is a 400 and no job is enqueued. Supplying only one bound is valid: a missing `dateTo` resolves to the time the job runs, a missing `dateFrom` to the campaign''s creation. Each bound you do supply must itself be parseable as a date-time — strict ISO 8601 admits forms such as the week date `2026-W33` that cannot be read, and such a bound returns 422 (`dateFrom must be a parseable ISO 8601 date-time`, or the `dateTo` equivalent) whether or not the other bound is present. Supplying both with a `dateTo` that is not after `dateFrom` returns 422 (`dateTo must be after dateFrom`), and again nothing is enqueued.'
      operationId: publicCreateCampaignExport
      x-mint:
        content: '<Warning>The Dialer is a newly released product surface: depending on your account''s rollout stage, campaigns managed through this API may not yet be visible in your CloudTalk Dashboard.</Warning>'
      parameters:
      - $ref: '#/components/parameters/dialerCampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialerCreateExportRequest'
            example:
              type: call_history
              format: csv
              filters:
                dateFrom: '2026-07-01T00:00:00.000Z'
                dateTo: '2026-08-01T00:00:00.000Z'
      responses:
        '202':
          description: The export job was accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerExportJob'
              example:
                jobId: 0197fbd1-6d0a-7e58-8f6f-1a2b3c4d5e6f
                status: queued
        '400':
          description: The body is invalid — an id below `1`, a `dateFrom` / `dateTo` that is not strict ISO 8601, a missing `type` or `format`. No job is enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerError'
              example:
                statusCode: 400
                message: Validation error
                error: Bad Request
                correlationId: YevPQs
                subErrors:
                - filters.contactId must not be less than 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'The date window cannot be served: `dateTo` is not after `dateFrom` (`dateTo must be after dateFrom`). No job is enqueued. The service also answers 422 for a bound that is valid strict ISO 8601 but lies outside the RFC 3339 `date-time` shape this schema declares and cannot be read as an instant — a week date such as `2026-W33` (`dateFrom must be a parseable ISO 8601 date-time`, or the `dateTo` equivalent). A client that validates against this schema never sends one.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialerError'
              example:
                statusCode: 422
                message: dateTo must be after dateFrom
                error: Unprocessable Entity
                correlationId: YevPQs
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dialer/exports/{jobId}:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - Dialer
      summary: Get an export job's status
      description: 'Polls an export job by its id. `status` walks `queued` → `running` → `completed` | `failed`, and `progress` gives a coarse hint of how far the runner has got. A job belonging to another company reads as 404.


        A `completed` job does not expose the file here — fetch it through the export-download call (a pre-signed link is also emailed to the requester).


