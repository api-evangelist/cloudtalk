      properties:
        id:
          type: string
          description: Button ID.
          example: '15'
        tag_id:
          type: string
          description: Referenced call-tag ID.
          example: '101'
        outcome_kind:
          type: string
          description: How the dialer treats a call dispositioned with this button.
          enum:
          - successful_positive
          - successful_negative
          - rescheduled
          - unsuccessful_call_again
          - unsuccessful_do_not_call
          example: rescheduled
        color:
          type:
          - string
          - 'null'
          description: Colour of the referenced tag; null when the tag has no colour or the call tags cannot be read.
          example: '#FFAA00'
        display_order:
          type: integer
          description: Ascending display position.
          example: 0
        name:
          type:
          - string
          - 'null'
          description: Display name of the referenced tag; null only while the call tags cannot be read.
          example: Call back later
        outcome:
          type:
          - string
          - 'null'
          description: Outcome of the referenced tag; null only while the call tags cannot be read.
          example: rescheduled
    DialerExportJob:
      type: object
      description: Handle for a queued export job. Poll it with the export-status call.
      properties:
        jobId:
          type: string
          description: Export job ID.
          format: uuid
          example: 0197fbd1-6d0a-7e58-8f6f-1a2b3c4d5e6f
        status:
          type: string
          description: Job status at the moment of enqueue.
          enum:
          - queued
          - running
          - completed
          - failed
          example: queued
    DialerPeekContact:
      type: object
      description: One entry of the peek answer — a non-binding snapshot of the allocator's next picks.
      properties:
        campaign_contact_id:
          type: string
          description: Membership row ID.
          example: '5100'
        contact_id:
          type: string
          description: The contact's ID in Contacts.
          example: '88213'
        category:
          type: string
          description: Waterfall category the pick came from.
          example: fresh
        phone_numbers:
          type: array
          items:
            type: string
          description: The contact's numbers in dialing order (index 0 is primary).
          example:
          - '+421900123456'
          - '+421255512345'
        display_name:
          type:
          - string
          - 'null'
          description: Contact display name.
          example: Jane Kowalski
        timezone:
          type:
          - string
          - 'null'
          description: Contact's IANA timezone.
          example: Europe/Bratislava
        callback_notes:
          type:
          - string
          - 'null'
          description: Note attached to a scheduled callback; null otherwise.
          example: null
    DialerCampaignStatistics:
      type: object
      description: 'Aggregated campaign performance. `range` tells the basis apart: null means all-time (cumulative over the campaign''s lifetime, `updated_at` set), non-null means the counters cover exactly that window (`updated_at` null). The membership-state blocks always describe the campaign''s current state regardless of any window.'
      properties:
        campaign_id:
          type: string
          description: Campaign ID the statistics belong to.
          example: '42'
        contact_states:
          $ref: '#/components/schemas/DialerContactStateCounts'
        contact_states_dialable:
          allOf:
          - $ref: '#/components/schemas/DialerContactStateCounts'
          description: Per-state count of contacts that have at least one phone number — a breakout of `contact_states`, not a filter.
        contact_states_repeated:
          allOf:
          - $ref: '#/components/schemas/DialerContactStateCounts'
          description: Per-state count of contacts already attempted at least once — a breakout of `contact_states`, not a filter. Subtract it from `contact_states` for the never-attempted counts.
        pending_by_category:
          $ref: '#/components/schemas/DialerPendingByCategoryCounts'
        total_contacts_at_range_end:
          type: integer
          description: 'Contacts that were members of the campaign at the window''s end (on an all-time read: the full current membership).'
          example: 165
        open_assignments:
          type: integer
          description: Contacts currently held by agents. Always a current-state count, never narrowed by the window.
          example: 3
        assigned_by_state:
          type: object
          description: open_assignments split by the held contact's current state. pending is the slice to subtract from a waiting reading (contact_states_dialable.pending), scheduled the slice to subtract from a scheduled reading — a held contact keeps its state while an agent works it. A breakout of open_assignments, not a filter. Always a current-state count, never narrowed by the window.
          properties:
            pending:
              type: integer
              example: 2
            scheduled:
              type: integer
              example: 1
        assigned_pending_by_category:
          allOf:
          - $ref: '#/components/schemas/DialerPendingByCategoryCounts'
          description: Waterfall-category slices of the PENDING held contacts only — which categories the contacts agents currently hold were taken from. Scoped like pending_by_category; sums to assigned_by_state.pending. Always a current-state count, never narrowed by the window.
        total_dialed:
          type: integer
          description: Calls placed.
          example: 240
        total_answered:
          type: integer
          description: Calls answered.
          example: 150
        answer_rate:
          type: number
          description: '`total_answered` / `total_dialed`, in the range 0–1.'
          example: 0.625
        num_rescheduled:
          type: integer
          description: Calls dispositioned as rescheduled.
          example: 12
        num_dropped:
          type: integer
          description: Calls dropped before an agent could take them.
          example: 3
        num_dispositioned:
          type: integer
          description: Calls that received a disposition.
          example: 96
        num_conversions:
          type: integer
          description: Calls dispositioned with a positive outcome.
          example: 30
        conversion_rate:
          type: number
          description: '`num_conversions` / `num_dispositioned`, in the range 0–1.'
          example: 0.3125
        num_reached_human:
          type: integer
          description: Attempts that reached a human.
          example: 130
        num_reached_voicemail:
          type: integer
          description: Attempts that reached a voicemail.
          example: 15
        num_reached_other_machine:
          type: integer
          description: Attempts that reached another machine (IVR, queue, tone).
          example: 5
        attempt_no_split:
          $ref: '#/components/schemas/DialerAttemptNoSplit'
        distinct_called_contacts:
          type:
          - integer
          - 'null'
          description: Distinct contacts dialed inside the window. Ranged-only — null on every all-time response.
          example: null
        distinct_answered_contacts:
          type: integer
          description: Distinct contacts that answered. Never null; an all-time read counts contacts whose first answer is on record, a ranged read counts distinct answered contacts inside the window.
          example: 112
        call_durations:
          $ref: '#/components/schemas/DialerCallDurationTotals'
        disposition_breakdown:
          type: array
          description: Per-tag disposition counts.
          items:
            $ref: '#/components/schemas/DialerDispositionBreakdownEntry'
        updated_at:
          type:
          - string
          - 'null'
          description: Freshness of the all-time projection (ISO 8601, UTC). Null on every ranged response, and null on an all-time response whose projection has not materialized yet.
          format: date-time
          example: '2026-08-04T11:40:00.000Z'
        range:
          $ref: '#/components/schemas/DialerStatisticsRange'
    DialerReplaceDispositionButtonsRequest:
      type: object
      description: Replace-all body for a campaign's disposition buttons. A `color` key on a button is rejected with 400 — presentation always comes from the referenced tag.
      required:
      - buttons
      properties:
        buttons:
          type: array
          description: The complete button set for the campaign. An empty array clears every button.
          items:
            $ref: '#/components/schemas/DialerDispositionButtonInput'
    DialerSurveyQuestionInput:
      type: object
      required:
      - label
      - type
      description: A question as sent in create/replace requests. Never carries ids — they are server-generated.
      properties:
        label:
          type: string
          description: Question text.
          minLength: 1
          maxLength: 1000
          example: Was the customer interested?
        type:
          type: string
          description: Input widget.
          enum:
          - text
          - textarea
          - radio
          - checkbox
          - select
          example: radio
        is_required:
          type: boolean
          description: Whether the agent must answer. Defaults to `false`.
          default: false
        display_order:
          type: integer
          description: Zero-based position. Defaults to `0`.
          minimum: 0
          default: 0
        options:
          type: array
          description: Choices for choice-type questions.
          items:
            $ref: '#/components/schemas/DialerSurveyOptionInput'
    DialerReplaceAssociationsRequest:
      type: object
      description: Replace-all body for a campaign's associations. Each array is optional and defaults to empty, so an omitted kind clears that kind. Every entry may be given either as an object or as a bare id. Naming the same `(kind, ref_id)` twice in one body is rejected as a conflict.
      properties:
        target_tag:
          type: array
          description: Contact tags that define the campaign's membership. Naming a CRM-connection-owned tag re-ranks it in place; adding or removing such a tag is owned by the CRM connection, not this call.
          items:
            oneOf:
            - $ref: '#/components/schemas/DialerAssociationEntry'
            - type: integer
              description: 'Shorthand for `{ "ref_id": <id> }`.'
              minimum: 1
        queue_group:
          type: array
          description: Queue groups the campaign draws its agents from.
          items:
            oneOf:
            - $ref: '#/components/schemas/DialerAssociationEntry'
            - type: integer
              description: 'Shorthand for `{ "ref_id": <id> }`.'
              minimum: 1
        agent:
          type: array
          description: Agents (users) assigned to the campaign.
          items:
            oneOf:
            - $ref: '#/components/schemas/DialerAssociationEntry'
            - type: integer
              description: 'Shorthand for `{ "ref_id": <id> }`.'
              minimum: 1
    DialerScriptList:
      type: object
      description: One cursor page of call scripts.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DialerScript'
        meta:
          $ref: '#/components/schemas/DialerCursorMeta'
    DialerTtlPolicy:
      type: object
      description: Contact-eligibility expiry bundle — drives how long an allocated contact stays held. Every knob is optional.
      properties:
        mode:
          type: string
          description: How the expiry window is derived.
          example: campaign
        hours:
          type: integer
          description: Expiry window in hours while the campaign is running.
          minimum: 0
          example: 72
        paused_hours:
          type: integer
          description: Expiry window in hours while the campaign is paused.
          minimum: 0
          example: 168
    DialerExportFilters:
      type: object
      description: Optional narrowing filters. Omitting the whole object exports everything for the campaign. Supplying only one of `dateFrom` / `dateTo` is valid — a missing end resolves to the time the job runs, a missing start to the campaign's creation.
      properties:
        contactId:
          type: integer
          description: Restrict the export to one contact. Must be a positive id — `0` or a negative value is rejected with 400 (`filters.contactId must not be less than 1` in `subErrors`).
          minimum: 1
          example: 900123
        userId:
          type: integer
          description: Restrict the export to one agent (user). Must be a positive id — `0` or a negative value is rejected with 400 (`filters.userId must not be less than 1` in `subErrors`).
          minimum: 1
          example: 800001
        dateFrom:
          type: string
          description: Only rows at or after this instant, as an RFC 3339 date-time. The service validates strict ISO 8601, so a calendar-impossible value such as `2026-02-31T00:00:00.000Z` is rejected with 400 rather than rolled forward.
          format: date-time
          example: '2026-07-01T00:00:00.000Z'
        dateTo:
          type: string
          description: Only rows at or before this instant, as an RFC 3339 date-time. Validated exactly like `dateFrom`.
          format: date-time
          example: '2026-08-01T00:00:00.000Z'
    DialerCallingPolicy:
      type: object
      description: Per-call behaviour bundle. Every knob is optional — an omitted knob keeps the service default. Only the knobs documented here are stored — any other key in the bundle is silently dropped.
      properties:
        answer_wait:
          type: integer
          description: Seconds to wait for an answer before giving up on the number.
          minimum: 0
          example: 25
        after_call:
          type: integer
          description: Wrap-up (after-call work) seconds granted to the agent; 0 means no wrap-up.
          minimum: 0
          example: 10
        recording:
          type: boolean
          description: Whether calls placed by this campaign are recorded.
          example: true
        number_selection:
          type: string
          description: Strategy used to pick which of a contact's numbers is dialed.
          example: first
        outbound_number_id:
          type:
          - integer
          - 'null'
          description: Pins the campaign's outbound caller number; null lets the service pick.
          minimum: 1
          example: 12
        number_rotation_enabled:
          type: boolean
          description: 'Enables sequential rotation over a contact''s numbers: a number that is not reached (no answer, busy, failed) advances a per-contact cursor to the next number; an answered call stops the cycle. Absent or `false` pins every attempt to the primary number. Must be a boolean when sent — an explicit null is rejected.'
          example: false
        parallel_calls:
          type: integer
          description: Number of simultaneous calls per agent in `parallel` mode.
          minimum: 0
          example: 2
        voicemail_drop_id:
          type: integer
          description: Voicemail-drop template used by the agent's voicemail action.
          minimum: 0
          example: 7
    DialerSchedulePolicy:
      type: object
      description: Campaign start-window bundle. Every knob is optional.
      properties:
        start_date:
          type: string
          description: Company-local calendar date the campaign may start dialing. Must be a real calendar date in `YYYY-MM-DD` — any other form, or a date that does not exist such as `2026-02-30`, is rejected with 400 (`schedule_policy.start_date must be a real calendar date in YYYY-MM-DD` in `subErrors`).
          format: date
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
          example: '2026-08-10'
        start_time:
          type: string
          description: Company-local wall-clock time on `start_date`. Must be a valid `HH:MM` or `HH:MM:SS` time, components zero-padded and in range — any other form, or an impossible time such as `25:00`, is rejected with 400 (`schedule_policy.start_time must be a valid HH:MM or HH:MM:SS time` in `subErrors`). Omit it for midnight.
          pattern: ^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$
          example: 09:00
        timezone_rule_enabled:
          type: boolean
          description: When true the start window is applied in the contact's own timezone.
          example: true
    DialerPatchScriptRequest:
      type: object
      description: Body of the patch-script call. Every field is optional; omitted fields stay untouched.
      properties:
        name:
          type: string
          description: New display name. Leading and trailing whitespace is trimmed before validation, so a blank or whitespace-only name is rejected with 400 (`name should not be empty` in `subErrors`).
          minLength: 1
          pattern: \S
          maxLength: 255
          example: Summer promo pitch v2
        body:
          type: string
          description: New script content.
          minLength: 1
          example: Hi {{first_name}}…
        is_archived:
          type: boolean
          description: '`true` archives the script, `false` restores it.'
          example: false
    DialerAssociations:
      type: object
      description: A campaign's associations, grouped by kind.
      properties:
        target_tag:
          type: array
          description: Target-tag associations, each with its priority, label and origin.
          items:
            $ref: '#/components/schemas/DialerTargetTagAssociation'
        queue_group:
          type: array
          description: Associated queue-group ids.
          items:
            type: integer
          example:
          - 20
        agent:
          type: array
          description: Associated agent (user) ids.
          items:
            type: integer
          example:
          - 800001
    DialerPendingByCategoryCounts:
      type: object
      description: Breakout of `contact_states.pending` by waterfall category — the four sum exactly to the pending total. Includes non-dialable pending contacts, so it is not an available-to-dial count.
      properties:
        favorite:
          type: integer
          description: Pending contacts marked favorite.
          example: 6
        rescheduled:
          type: integer
          description: Pending contacts whose last outcome rescheduled them.
          example: 12
        retry:
          type: integer
          description: Pending contacts waiting on an automatic retry.
          example: 22
        fresh:
          type: integer
          description: Pending contacts never attempted.
          example: 80
  responses:
    TooManyRequests:
      description: Too many requests
      headers:
        X-CloudTalkAPI-Limit:
          description: Maximum number of API requests allowed in the current time window.
          schema:
            type: integer
        X-CloudTalkAPI-Remaining:
          description: Number of API requests left in the current window.
          schema:
            type: integer
        X-CloudTalkAPI-ResetTime:
          description: Time when the rate-limit window resets, as a Unix timestamp.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 429
            message: Too Many Requests
            error: Too Many Requests
            correlationId: YevPQs
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 404
            message: Not Found
            error: Not Found
            correlationId: YevPQs
    NoContentResponse:
      description: Operation completed successfully. A 204 response has an empty body.
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 409
            message: Conflict
            error: Conflict
            correlationId: YevPQs
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 503
            message: Service Unavailable
            error: Service Unavailable
            correlationId: YevPQs
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 400
            message: Validation error
            error: Bad Request
            correlationId: YevPQs
            subErrors:
            - incorrect email
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 422
            message: Unprocessable Entity
            error: Unprocessable Entity
            correlationId: YevPQs
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            description: Error envelope returned by the authentication layer in front of the `api.cloudtalk.io/v1` surface. It differs from the per-service error shapes used for other statuses.
            properties:
              code:
                type: string
                description: Error code
                example: UNAUTHORIZED
              message:
                type: string
                description: Error message
                example: You are not authorized to access this resource.
            required:
            - code
            - message
          example:
            code: UNAUTHORIZED
            message: You are not authorized to access this resource.
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 500
            message: Internal Server Error
            error: Internal Server Error
            correlationId: YevPQs
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your API Access Key ID as the username and your API Access Key Secret as the password. Generate keys in the CloudTalk Dashboard under Account -> Settings -> API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys).
