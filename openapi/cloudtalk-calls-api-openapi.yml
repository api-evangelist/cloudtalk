openapi: 3.2.0
info:
  title: CloudTalk Calls API
  description: '# Introduction

    Welcome to CloudTalk API reference! Many of these businesses use the CloudTalk API to automate and enhance their customer support with CloudTalk Support. With CloudTalk we are re-building telco industry from the ground and taking it to the next level with first-class customer support system. Please find below the full documenation to CloudTalk. # API Overview


    The API is organized around the following resources:


    API Area | Description

    ----------------|-------------

    Calls | Browse your call history, download recordings and access all your calls data. Contacts | Create and update Contacts. Use filters to get lists of Contacts, or access their profiles individually. Numbers | Automate Numbers modifications. List all your numbers. Agents | Create or update your Agents, access their settings. Conversation Intelligence | Get Conversation Intelligence data about your calls. VoiceAgent | Initiate VoiceAgent calls


    JSON is returned in all responses. XML is not supported. The API also uses common approaches for the following:


    Function | Description

    ----------------|-------------

    Data | API data is JSON encoded with UTF-8. API JSON is either a single object or a list of objects. Errors | 4xx and 5xx responses returning JSON with error codes

    Rate Limiting | Controls how many requests can be made in a time window

    HTTP | Methods are used in accordance with HTTP (GET POST and DELETE are the primary methods used) and resources are identified using URIs. All API requests are sent over HTTPS. ## Authentication


    This is an HTTPS-only API. Authentication is based on API Access Key ID and Access Key Secret. The API Access Key ID and Access Key Secret is passed via HTTP Basic Authentication. Basic Auth credentials are used to determine on which project should this request be executed on. List of all Basic Auth credentials for the project can be found by Administrators in the CloudTalk Dashboard under Account → Settings → API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys). To try the API via curl on the command-line, the general form used would be:

    ```

    curl -u ACCESS_KEY_ID:ACCESS_KEY_SECRET API_URL

    ```


    For instance, you would execute:

    ```

    curl -u ABCDEFGHIJTESTKEY1:X05Dg4c331c3h61An https://my.cloudtalk.io/api/calls/index.json

    ```


    ## Usage


    The API may rate limit submission of requests for your application. Such limits are managed as an allowed number of operations per time window, where an operation might be read or an update. In that case a **''429 Too Many Requests''** response code will be returned along with the following headers -


    Header name | Description

    ----------------|-------------

    X-CloudTalkAPI-Limit | Maximum number of API requests allowed in the current time window. X-CloudTalkAPI-Remaining | Number of API requests left in the current window. X-CloudTalkAPI-ResetTime | Time when rate limit window will be reset as a Unix timestamp. Note that the default rate limit is **60 operations per minute per company**. If you need to make more requests, please contact our support with detailed explanation of your use case. ## Response Envelopes


    **Note:** Conversation Intelligence doesn''t follow envelopes. The API returns one of three envelopes depending upon the request issued:


    1. Single Item Envelope

    2. Collections Envelope

    3. Error Envelope


    ### Single Item Envelope


    All dates/times are returned in ISO8601 format and in UTC timezone. ```

    Status: 200 OK

    {

    "responseData": {

    "id": 123,

    ... "created": "2018-01-10 12:34:56"

    }

    }

    ```


    ### Collections Envelope


    All dates/times are returned in ISO8601 format and in UTC timezone. ```

    Status: 200 OK

    {

    "responseData": {

    "itemsCount": 65,

    "pageCount": 3,

    "pageNumber": 1,

    "limit": 30,

    "data": [

    {

    "id": 123,

    ... "created": "2018-01-10 12:34:56"

    },

    {

    "id": 456,

    ... "created": "2017-10-19 09:21:29"

    },

    ...'
  contact:
    name: CloudTalk API Support
    url: https://www.cloudtalk.io/contact
  version: '1.7'
  x-logo:
    url: https://my.cloudtalk.io/img/logo-cloudtalk-color.png
servers:
- url: https://my.cloudtalk.io/api
security:
- basicAuth: []
tags:
- name: Calls
  description: All data you can get about your calls.
paths:
  /calls/index.json:
    get:
      tags:
      - Calls
      summary: Call history
      description: Returns call history. Filter by the numbers involved (`public_internal`, `public_external`), a date range (`date_from`, `date_to`), `contact_id`, `user_id`, `agent_extension`, call `type` or `status`, `tag_id`, or a specific `call_id`; page through the result with `limit` and `page`.
      parameters:
      - name: public_internal
        in: query
        description: Filter by internal number of agent
        schema:
          type: string
      - name: public_external
        in: query
        description: Filter by number of caller
        schema:
          type: string
      - name: date_from
        in: query
        description: Filter by date from, e.g. 2017-12-24 12:22:00
        schema:
          type: string
          format: date-time
      - name: date_to
        in: query
        description: Filter by date to, napríklad 2017-12-24 12:22:00
        schema:
          type: string
          format: date-time
      - name: contact_id
        in: query
        description: Filter by assigned contact ID
        schema:
          type: integer
      - name: user_id
        in: query
        description: Filter by assigned agent ID
        schema:
          type: integer
      - name: agent_extension
        in: query
        description: Filter by assigned agent's extension.
        schema:
          type: integer
      - name: type
        in: query
        description: Filter by call type
        schema:
          type: string
          enum:
          - incoming
          - outgoing
          - internal
      - name: status
        in: query
        description: Filter by call status - 'missed' = for only missed calls, 'answered' = for all answered calls
        schema:
          type: string
          enum:
          - missed
          - answered
      - name: tag_id
        in: query
        description: Filter by assigned call tag ID
        schema:
          type: integer
      - name: call_id
        in: query
        description: Filter by call ID
        schema:
          type: integer
      - name: limit
        in: query
        description: Max. number of items in response data.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - name: page
        in: query
        description: Number of page to return.
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          description: Calls data
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      itemsCount:
                        type: integer
                        description: number of resources in the response
                        format: int64
                      pageCount:
                        type: integer
                        description: number of pages found
                        format: int64
                      pageNumber:
                        type: integer
                        description: current page in the response
                        format: int64
                      limit:
                        type: integer
                        description: number of objects sent per page
                        format: int64
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            Cdr:
                              $ref: '#/components/schemas/Cdr'
                            Contact:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Contact ID
                                name:
                                  type: string
                                  description: Name
                                  maxLength: 150
                                title:
                                  type: string
                                  description: Title
                                  maxLength: 255
                                company:
                                  type: string
                                  description: Company name
                                  maxLength: 100
                                industry:
                                  type: string
                                  description: Industry
                                  maxLength: 100
                                address:
                                  type: string
                                  description: Address
                                  maxLength: 255
                                city:
                                  type: string
                                  description: City
                                  maxLength: 255
                                zip:
                                  type: string
                                  description: ZIP code
                                  maxLength: 15
                                state:
                                  type: string
                                  description: State
                                  maxLength: 255
                                type:
                                  type: string
                                  description: Type of contact (contact/lead)
                                contact_numbers:
                                  type: array
                                  description: Array of contact numbers
                                  items:
                                    type: string
                                contact_emails:
                                  type: array
                                  description: Array of contact emails
                                  items:
                                    type: string
                                tags:
                                  type: array
                                  description: Array of contact tags
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: integer
                                        description: Tag ID
                                      name:
                                        type: string
                                        description: Tag name
                                external_urls:
                                  type: array
                                  description: Array of contact external urls
                                  items:
                                    type: object
                                    properties:
                                      external_system:
                                        type: string
                                        description: Name of external service. Name will be shown to agents while working with contacts.
                                      external_url:
                                        type: string
                                        description: External URL to contact page
                                custom_fields:
                                  type: array
                                  description: Array of contact emails
                                  items:
                                    type: object
                                    maximum: 255
                                    properties:
                                      key:
                                        type: string
                                        description: Custom field key (max 255 chars per attribute)
                                      value:
                                        type: string
                                        description: Custom field value (max 255 chars per attribute)
                                favorite_agent:
                                  $ref: '#/components/schemas/FavoriteAgent'
                              description: Contact assigned to this call
                            CallNumber:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Number ID
                                internal_name:
                                  type: string
                                  description: Internal name
                                caller_id_e164:
                                  type: string
                                  description: Full number in international E.164 format
                                country_code:
                                  type: integer
                                  description: Country calling code
                                area_code:
                                  type: integer
                                  description: Local area code
                              description: Internal number assigned to this call
                            BillingData:
                              $ref: '#/components/schemas/BillingData'
                            Agent:
                              $ref: '#/components/schemas/AgentCall'
                            Notes:
                              $ref: '#/components/schemas/CallNote'
                            Tags:
                              $ref: '#/components/schemas/CallTag'
                            Ratings:
                              $ref: '#/components/schemas/CallRating'
                required:
                - responseData
              example:
                responseData:
                  itemsCount: 3
                  pageCount: 1
                  pageNumber: 1
                  limit: 3
                  data:
                  - Cdr:
                      id: '27'
                      billsec: '0'
                      type: outgoing
                      country_code: '421'
                      public_external: 421904247371
                      public_internal: 421221291400
                      recorded: true
                      is_voicemail: false
                      fax_email: '0'
                      is_redirected: '0'
                      redirected_from: ''
                      is_local: true
                      user_id: '1234'
                      talking_time: '21'
                      started_at: '2017-10-04T06:33:37.000Z'
                      answered_at: '2017-10-04T06:33:37.000Z'
                      ended_at: '2017-10-04T06:33:49.000Z'
                      waiting_time: 2
                      wrapup_time: 5
                      recording_link: https://analytics.cloudtalk.io/call-details/27
                    Contact:
                      id: '1234'
                      name: Jon Doe
                      title: title
                      company: First ltd.
                      industry: IT
                      address: 8th Avenue
                      city: London
                      zip: '838298'
                      state: England
                      type: contact
                      tags:
                      - id: '615'
                        name: VIP
                      - id: '609'
                        name: Security
                      external_urls:
                      - external_system: CloudTalk
                        external_url: https://my.cloudtalk.io/c/show/1234
                      contact_numbers:
                      - 18884871675
                      contact_emails:
                      - jon.doe@first.com
                      custom_fields:
                      - key: age
                        value: '33'
                      favorite_agent:
                        id: '1234'
                        firstname: Max
                        lastname: Yellow
                        fullname: Max Yellow
                        email: max.yellow@cloudtalk.io
                        language: en
                        role: Admin
                        status: online
                        default_outbound_number: 442012345678
                        associated_numbers:
                        - 442012345678
                        groups:
                        - sales
                        - support
                    CallNumber:
                      id: '12345'
                      internal_name: Sales support
                      caller_id_e164: 442012345678
                      country_code: '44'
                      area_code: '20'
                    BillingCall:
                      price: '0.000000'
                    Agent:
                      id: '1234'
                      firstname: Max
                      lastname: Yellow
                      fullname: Max Yellow
                      email: max.yellow@cloudtalk.io
                      language: en
                      role: Admin
                      status: online
                      default_outbound_number: 442012345678
                      associated_numbers:
                      - 442012345678
                      groups:
                      - sales
                      - support
                    Notes:
                    - id: '23'
                      note: Call later
                    Tags:
                    - id: '123'
                      name: Missed
                    - id: '124'
                      name: VIP
      operationId: getCallsIndexJson
      x-operation-id-source: derived
  /calls/{callId}:
    get:
      servers:
      - url: https://analytics-api.cloudtalk.io/api/
      tags:
      - Calls
      summary: Get call details
      description: 'Returns everything recorded about a single call — its timings, the steps it took through the call flow, the agents and contacts involved, tags, rating and notes.


        This endpoint is served by `analytics-api.cloudtalk.io`, not the main API host. Returns `400` if `callId` is malformed and `404` if no such call exists.'
      parameters:
      - name: callId
        in: path
        required: true
        description: ID of a call
        schema:
          type: number
      responses:
        '200':
          description: Detailed information about a given call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
              example:
                cdr_id: 12345
                uuid: aaaa-bbbb-cccc-dddd
                company_id: 100123
                date: '2022-02-07T13:00:00.000Z'
                contact:
                  id: 1
                  name: John Doe
                  country: CZ
                  number: '+420123123123'
                call_tags:
                - id: 5
                  label: Lead
                call_rating: 3
                internal_number:
                  id: 1
                  name: Europe Sales
                  number: '+421456456456'
                call_times:
                  talking_time: 60
                  wrap_up_time: 10
                  ringing_time: 10
                  total_time: 80
                  waiting_time: 20
                  holding_time: 5
                direction: incoming
                type: regular
                status: answered
                call_steps:
                - type: ivr
                  id: 1
                  date: '2022-02-07T13:00:00.000Z'
                  total_time: 10
                  option: '1'
                - type: queue
                  id: 10
                  name: Queue10
                  date: '2022-02-07T13:00:10.000Z'
                  call_times:
                    talking_time: 60
                    wrap_up_time: 10
                    ringing_time: 10
                    total_time: 80
                    waiting_time: 10
                    holding_time: 3
                  status: answered
                  reason: null
                  resolved_by: null
                  resolved_by_call:
                    id: null
                    date: null
                    agent:
                      id: null
                      name: null
                  strategy: rrmemory
                  agent_calls:
                  - type: agent
                    id: 12
                    name: Agent12
                    group_ids:
                    - 10
                    - 20
                    date: '2022-02-07T13:00:10.000Z'
                    call_times:
                      talking_time: null
                      wrap_up_time: null
                      ringing_time: 5
                      total_time: 5
                      holding_time: null
                    status: missed
                    reason: offline
                    resolved_by: null
                    resolved_by_call:
                      id: null
                      date: null
                      agent:
                        id: null
                        name: null
                  - type: agent
                    id: 11
                    name: Agent11
                    group_ids:
                    - 10
                    - 20
                    date: '2022-02-07T13:00:15.000Z'
                    call_times:
                      talking_time: 60
                      wrap_up_time: 10
                      ringing_time: 5
                      total_time: 75
                      holding_time: 2
                    status: answered
                    reason: null
                    resolved_by: null
                    resolved_by_call:
                      id: null
                      date: null
                      agent:
                        id: null
                        name: null
                notes:
                - string
                recorded: true
                out_of_office: false
        '400':
          description: Bad Request - Invalid call ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: Status code
                  message:
                    type: string
                    description: The error message
                  error:
                    type: string
                    description: The error name
              example:
                statusCode: 400
                message:
                - callId must be a number conforming to the specified constraints
                error: Bad Request
        '404':
          description: Call not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: Status code
                  message:
                    type: string
                    description: The error message
                  error:
                    type: string
                    description: The error name
              example:
                statusCode: 404
                message: Call with id '12456' doesn't exist on company '100123'
                error: Not Found
      operationId: getCallsByCallId
      x-operation-id-source: derived
  /calls/recording/{callId}.json:
    get:
      tags:
      - Calls
      summary: Recording media
      description: Api endpoint returns media data of recording for selected call. Media data are returned in WAV format.
      parameters:
      - name: callId
        in: path
        description: Call ID for the requested recording
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Recording media data
          content:
            audio/x-wav:
              schema:
                $ref: '#/components/schemas/BinaryData'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
            audio/x-wav:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '410':
          description: Recording expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 410
                  message: Recording expired.
            audio/x-wav:
              schema:
                $ref: '#/components/schemas/ErrorData'
      operationId: getCallsRecording{callId}Json
      x-operation-id-source: derived
  /recordings/delete/{callId}.json:
    delete:
      tags:
      - Calls
      summary: Delete call recording
      description: Delete call recording file for good. Call recording will be deleted from all our systems.
      parameters:
      - name: callId
        in: path
        description: Call ID for recording to be deleted
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessGeneralData'
              example:
                responseData:
                  status: 200
        '404':
          description: Call not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '410':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 410
                  message: Recording not found.
      operationId: deleteRecordingsDelete{callId}Json
      x-operation-id-source: derived
  /calls/create.json:
    post:
      tags:
      - Calls
      summary: Make a call
      description: Make a call using to any phone numbers. To place a new outbound call, make an HTTP POST request. At first it will initiate a call to an agent. Maximum waiting time for an agent to pick up the call is 20 seconds. After an agent picks up, we will automatically call desired phone number.
      requestBody:
        content:
          application/json:
            schema:
              required:
              - agent_id
              - callee_number
              type: object
              properties:
                agent_id:
                  type: integer
                  description: Agent ID which will make the call.
                callee_number:
                  type: string
                  description: The phone number that will receive this Call. Phone numbers must be in E.164 format (e.g., +442012345678).
        required: true
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Status code
                required:
                - responseData
              example:
                responseData:
                  status: 200
        '403':
          description: Agent is not online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 403
                  message: Agent is not online.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '406':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidData'
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
        '409':
          description: Agent is already calling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 409
                  message: Agent is already calling.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      x-codegen-request-body-name: body
      operationId: postCallsCreateJson
      x-operation-id-source: derived
  /statistics/realtime/groups.json:
    get:
      tags:
      - Calls
      summary: Group statistics
      description: 'Returns today''s live call statistics for every group: agents in the group, answered and unanswered calls, abandon rate, average call duration, and average and maximum waiting times — plus a `real_time` block giving the current queue length and waiting times. Takes no parameters.'
      responses:
        '200':
          description: Group stats data
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Group name.
                                id:
                                  type: integer
                                  description: Group ID.
                                operators:
                                  type: integer
                                  description: Number of agents in group.
                                answered:
                                  type: integer
                                  description: Answered calls to group today.
                                unanswered:
                                  type: integer
                                  description: Unanswered calls to group today.
                                abandon_rate:
                                  type: number
                                  description: Abandon rate.
                                  format: float
                                avg_waiting_time:
                                  type: integer
                                  description: Average waiting time today.
                                max_waiting_time:
                                  type: integer
                                  description: Max waiting time today.
                                avg_call_duration:
                                  type: integer
                                  description: Average call duration today.
                                real_time:
                                  type: object
                                  properties:
                                    waiting_queue:
                                      type: integer
                                      description: Waiting calls
                                    avg_waiting_time:
                                      type: integer
                                      description: Average waiting time
                                    max_waiting_time:
                                      type: integer
                                      description: Max waiting time.
                                    avg_abandonment_time:
                                      type: integer
                                      description: Average abandonment time.
                                  description: Real time stats
                required:
                - responseData
              example:
                responseData:
                  data:
                    groups:
                    - name: Agents
                      id: 123
                      operators: 3
                      answered: 12
                      unanswered: 2
                      abandon_rate: 14.29
                      avg_waiting_time: 48
                      max_waiting_time: 55
                      avg_call_duration: 24
                      real_time:
                        waiting_queue: 2
                        avg_waiting_time: 23
                        max_waiting_time: 53
                        avg_abandonment_time: 12
                    - name: Avengers
                      id: 124
                      operators: 3
                      answered: 12
                      unanswered: 2
                      abandon_rate: 14.29
                      avg_waiting_time: 48
                      max_waiting_time: 55
                      avg_call_duration: 24
                      real_time:
                        waiting_queue: 2
                        avg_waiting_time: 23
                        max_waiting_time: 53
                        avg_abandonment_time: 12
      operationId: getStatisticsRealtimeGroupsJson
      x-operation-id-source: derived
components:
  schemas:
    CallTag:
      type: array
      description: Tags assigned to this call - can include multiple
      items:
        type: object
        properties:
          id:
            type: integer
            description: Tag ID
          name:
            type: string
            description: Tag
    AgentCall:
      type: object
      properties:
        id:
          type: integer
          description: Agent ID
        firstname:
          type: string
          description: First name
        lastname:
          type: string
          description: Last name
        fullname:
          type: string
          description: Full name
        email:
          type: string
          description: Email
          format: email
        language:
          type: string
          description: Language
        role:
          type: string
          description: Role
        status:
          type: string
          description: Online status
        default_outbound_number:
          type: string
          description: Default outbound number in E164 format
        associated_numbers:
          type: array
          description: Array of associated numbers
          items:
            type: string
        groups:
          type: array
          description: Array of assigned groups
          items:
            type: string
      description: Agent data
    CallNote:
      type: array
      description: Notes assigned to this call
      items:
