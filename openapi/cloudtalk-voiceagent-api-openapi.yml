  /knowledge-bases:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: List knowledge bases
      description: Returns one page of the company's knowledge bases. Pages are ordered by identifier and walked with limit and cursor.
      operationId: public-v1-list-knowledge-bases
      parameters:
      - description: Page size, 1-100; out-of-range values are clamped and the effective value echoed in pagination.limit
        example: 20
        explode: false
        in: query
        name: limit
        schema:
          default: 20
          description: Page size, 1-100; out-of-range values are clamped and the effective value echoed in pagination.limit
          example: 20
          type: integer
      - description: Opaque cursor from a previous page's pagination.next
        explode: false
        in: query
        name: cursor
