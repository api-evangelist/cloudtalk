paths:
  /voice-agent/calls:
    post:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: Initiate VoiceAgent call
      description: Creates a new VoiceAgent call with specified parameters and properties. Call properties are optional and can be used to configure the call.
      operationId: createVoiceAgentCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - call_number
              - voice_agent_id
              properties:
                call_number:
                  type: string
                  description: The phone number to call
                  example: '+421000000000'
                voice_agent_id:
                  type: string
                  description: ID of the VoiceAgent to use for the call
                  example: 681b0639876543cfbc3d6b55
                call_properties:
                  type: object
                  description: Additional properties for configuring the VoiceAgent call
                  properties:
                    output:
                      type: object
                      description: Variables that will be included in the VoiceAgent call analysis output
                      properties:
                        variables:
                          type: object
                          additionalProperties: true
                          description: Variables that will be included in the call analysis output
                          example:
                            external_contact_id: 12345
                    system_prompt:
                      type: object
                      description: Variables that will be used during the actual call by the VoiceAgent
                      properties:
                        variables:
                          type: object
                          additionalProperties: true
                          description: Variables that will be used in the VoiceAgent's system prompt during the call
                          example:
                            name: John Doe
                            company: CloudTalk
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /voice-agent/outbound/kill:
    post:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: Stop outbound VoiceAgent calls
      description: 'Emergency stop for outbound VoiceAgent dialing.


        Queued calls are cancelled and calls already in progress are ended within a few seconds, through the normal call-end path — billing, call records and analytics stay correct. **Inbound calls are unaffected**, as is the outbound traffic of every other company.


        The stop **expires on its own** after `duration_seconds`, so a forgotten stop cannot silence an account indefinitely. Sending the request again overwrites the window; sending `duration_seconds: 0` lifts it early.


        By default the stop covers all of the company''s outbound calls. Supply `voice_agent_id` to stop a single VoiceAgent while the others keep dialing.


        Queued calls cancelled by a stop are **not dialed later** when the window expires — they are marked declined and removed.


        This endpoint is rate limited to **10 requests per minute per company**, below the API-wide default of 60 — a single request already stops the whole company.'
      operationId: killVoiceAgentOutbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - duration_seconds
              properties:
                duration_seconds:
                  type: integer
                  description: How long to stop outbound dialing, in seconds. `0` cancels a stop that is currently active for the same scope. Maximum 86400 (24 hours).
                  minimum: 0
                  maximum: 86400
                  example: 600
                voice_agent_id:
                  type: string
                  description: Restrict the stop to a single VoiceAgent. Omit to stop all of the company's outbound calls. Must be a VoiceAgent belonging to your company.
                  example: 681b0639876543cfbc3d6b55
                reason:
                  type: string
                  description: Optional free text recorded in the audit log.
                  maxLength: 256
                  example: runaway campaign
      responses:
        '200':
          description: Outbound dialing stopped, or resumed when `duration_seconds` was 0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  killed_until_unix:
                    type: integer
                    format: int64
                    description: Unix timestamp (seconds) at which the stop expires and dialing resumes on its own. This is a point in time, not a duration. `0` after a cancel.
                    example: 1786966737
                  drained_count:
                    type: integer
                    description: Number of queued outbound calls this request cancelled.
                    example: 3
                  cancelled:
                    type: boolean
                    description: True when the request lifted an existing stop instead of setting one.
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The VoiceAgent named by `voice_agent_id` was not found. An id that belongs to another company is reported the same way as one that does not exist.
        '422':
          description: The request body failed validation — for example `duration_seconds` outside 0–86400, or a property that is not part of this request.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: 'Outbound calling was **not** stopped: the request could not be delivered. Nothing changed, so the call is safe to retry — and must be, since dialing is still running.'
  /voice-agents:
    get:
      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: List voice agents
      description: Returns one page of the company's voice agents. Pages are ordered by creation and walked with limit and cursor.
      operationId: public-v1-list-voice-agents
      parameters:
      - description: Page size, 1-100; out-of-range values are clamped and the effective value echoed in pagination.limit
        example: 20
        explode: false
        in: query
        name: limit
        schema:
          default: 20
          description: Page size, 1-100; out-of-range values are clamped and the effective value echoed in pagination.limit
          example: 20
          type: integer
      - description: Opaque cursor from a previous page's pagination.next
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque cursor from a previous page's pagination.next
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionVoiceAgentListAttributes'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
