components:
  schemas:
    VoiceAgentBackgroundSound:
      additionalProperties: false
      properties:
        isCrossfadeLoopEnabled:
          description: Smooth the seam when the ambience loops
          type:
          - boolean
          - 'null'
        preset:
          description: Ambience preset
          enum:
          - city
          - elevator
          - elevator2
          - elevator3
          - elevator4
          - office
          - office2
          - restaurant
          - typing
          type: string
        volume:
          description: Ambience volume; null uses the provider default
          format: double
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
      required:
      - preset
      type:
      - object
      - 'null'
    PublicErrorObject:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/PublicErrorDetail'
          type:
          - array
          - 'null'
        message:
          type: string
        target:
          type: string
      required:
      - code
      - message
      type: object
    VoiceAgentGuardrail:
      additionalProperties: false
      properties:
        isEnabled:
          description: Whether the guardrail is active
          type: boolean
        reply:
          description: What the agent answers instead
          maxLength: 2000
          type: string
        when:
          description: Situation the guardrail covers
          maxLength: 2000
          type: string
      required:
      - isEnabled
      type: object
    VoiceAgentOptimizedChange:
      additionalProperties: false
      properties:
        from:
          description: The value the agent runs with; null when unset
        path:
          description: 'Attribute path of the setting, as a write body spells it: provider, llm, minorVersion, elevenLabsSettings.isVadEnabled, elevenLabsSettings.turnModel, elevenLabsSettings.isSpeculativeTurnEnabled or elevenLabsSettings.turnEagerness'
          example: llm
          type: string
        to:
          description: The optimized value
      required:
      - path
      - from
      - to
      type: object
    VoiceAgentSkills:
      additionalProperties: false
      properties:
        answerQuestions:
          allOf:
          - $ref: '#/components/schemas/VoiceAgentAnswerQuestionsSkill'
