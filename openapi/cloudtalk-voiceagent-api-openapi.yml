      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: Create a knowledge base
      description: Creates a knowledge base from an address or from inline text. A URL source starts SYNCHRONIZING and turns ACTIVE once it has been read. A company may hold at most 100 knowledge bases; at the cap the request answers 409 KNOWLEDGE_BASE_LIMIT_REACHED.
