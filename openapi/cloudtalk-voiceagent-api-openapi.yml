      servers:
      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: Detach a knowledge base from a voice agent
      description: Unlinks the knowledge base from the agent; the knowledge base itself is kept.
      operationId: public-v1-detach-voice-agent-knowledge-base
      parameters:
      - name: voiceAgentId
        in: path
        required: true
        description: Voice agent identifier
        schema:
          description: Voice agent identifier
          type: string
      - name: knowledgeBaseId
        in: path
        required: true
        description: Knowledge base identifier
        schema:
          description: Knowledge base identifier
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
