          description: Number of API requests left in the current window.
          schema:
            type: integer
        X-CloudTalkAPI-ResetTime:
          description: Time when the rate-limit window resets, as a Unix timestamp.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 429
            message: Too Many Requests
            error: Too Many Requests
            correlationId: YevPQs
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 404
            message: Not Found
            error: Not Found
            correlationId: YevPQs
    NoContentResponse:
      description: Operation completed successfully. A 204 response has an empty body.
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 400
            message: Validation error
            error: Bad Request
            correlationId: YevPQs
            subErrors:
            - incorrect email
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            description: Error envelope returned by the authentication layer in front of the `api.cloudtalk.io/v1` surface. It differs from the per-service error shapes used for other statuses.
            properties:
              code:
                type: string
                description: Error code
                example: UNAUTHORIZED
              message:
                type: string
                description: Error message
                example: You are not authorized to access this resource.
            required:
            - code
            - message
          example:
            code: UNAUTHORIZED
            message: You are not authorized to access this resource.
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DialerError'
          example:
            statusCode: 500
            message: Internal Server Error
            error: Internal Server Error
            correlationId: YevPQs
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your API Access Key ID as the username and your API Access Key Secret as the password. Generate keys in the CloudTalk Dashboard under Account -> Settings -> API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys).
