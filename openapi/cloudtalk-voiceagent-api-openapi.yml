      operationId: public-v1-attach-voice-agent-knowledge-base
      parameters:
      - name: voiceAgentId
        in: path
        required: true
        description: Voice agent identifier
        schema:
          description: Voice agent identifier
          type: string
      - name: knowledgeBaseId
        in: path
        required: true
        description: Knowledge base identifier
        schema:
          description: Knowledge base identifier
          type: string
      responses:
