      - url: https://api.cloudtalk.io/v1
      tags:
      - VoiceAgent
      summary: Upload a knowledge base file
      description: Creates a knowledge base from one uploaded file. The name is derived from the filename. A company may hold at most 100 knowledge bases; at the cap the request answers 409 KNOWLEDGE_BASE_LIMIT_REACHED.
      operationId: public-v1-upload-knowledge-base-file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  description: The file to ingest as a knowledge base
                  format: binary
                  type: string
              required:
