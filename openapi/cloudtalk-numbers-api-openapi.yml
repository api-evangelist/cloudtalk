- url: https://my.cloudtalk.io/api
security:
- basicAuth: []
tags:
- name: Numbers
  description: All data you can get about your numbers.
paths:
  /numbers/index.json:
    get:
      tags:
      - Numbers
      summary: List numbers
      description: Returns the phone numbers assigned to the account. Filter by `id`, `country_code`, `area_code`, what the number is `connected_to`, or `is_free` to show only numbers with no routing configured; page with `limit` and `page`.
      parameters:
      - name: id
        in: query
        description: Filter by number ID
        schema:
          type: integer
      - name: country_code
        in: query
        description: Filter by country calling code
        schema:
          type: integer
      - name: area_code
        in: query
        description: Filter by local area code. Area code cannot contain 0 at the beginning
        schema:
          type: integer
      - name: connected_to
        in: query
        description: Filter by route type. `0 = 'group'`, `1 = 'agent'`, `2 = 'conference room'`, `3 = 'fax'`
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
      - name: is_free
        in: query
        description: Filter by availability. `0 = 'taken'`, `1 = 'free'`
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: limit
        in: query
        description: Max. number of items in response data.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - name: page
        in: query
        description: Number of page to return.
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          description: Numbers data
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      itemsCount:
                        type: integer
                        description: number of resources in the response
                        format: int64
                      pageCount:
                        type: integer
                        description: number of pages found
                        format: int64
                      pageNumber:
                        type: integer
                        description: current page in the response
                        format: int64
                      limit:
                        type: integer
                        description: number of objects sent per page
                        format: int64
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            CallNumber:
                              $ref: '#/components/schemas/CallNumber'
                required:
                - responseData
              example:
                responseData:
                  itemsCount: 3
                  pageCount: 1
                  pageNumber: 1
                  limit: 3
                  data:
                  - CallNumber:
                      id: '123'
                      country_code: '44'
                      area_code: '20'
                      internal_name: Sales support
                      caller_id_e164: 442012345678
                      is_redirected: false
                      connected_to: '1'
                      source_id: '4'
      operationId: getNumbersIndexJson
      x-operation-id-source: derived
  /numbers/edit/{id}.json:
    post:
      tags:
      - Numbers
      summary: Edit a number
      description: 'Updates the number identified by `id`. All three fields are optional: `internal_name` sets the number''s internal label, and `connected_to` with `source_id` set what it routes to. To strip a number''s routing entirely, use Unregister a number instead. Returns `404` if no number has that ID.


        Note the core API updates with `POST`, not `PUT`.'
      parameters:
      - name: id
        in: path
        description: Number ID to edit
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                internal_name:
                  type: string
                  description: Internal name
                connected_to:
                  type: integer
                  description: Routing type. Where is the number connected. `0 = 'group'`, `1 = 'agent'`, `2 = 'conference room'`, `3 = 'fax'`
                source_id:
                  type: integer
                  description: Source ID of where is the number located, e.g. Agent ID, Group ID...
        required: true
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Status code
                required:
                - responseData
              example:
                responseData:
                  status: 200
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '406':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidData'
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
                  data:
                    type:
                    - Please supply a valid type.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      x-codegen-request-body-name: body
      operationId: postNumbersEdit{id}Json
      x-operation-id-source: derived
  /numbers/clear/{id}.json:
    delete:
      tags:
      - Numbers
      summary: Unregister a number
      description: Clear current route settings of the number. Number will be marked as free.
      parameters:
      - name: id
        in: path
        description: Number ID to unregister
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessGeneralData'
              example:
                responseData:
                  status: 200
        '404':
          description: Number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      operationId: deleteNumbersClear{id}Json
      x-operation-id-source: derived
components:
  schemas:
    ErrorInvalidData:
      type: object
      description: Validation-error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
            data:
              type: object
              properties: {}
              description: Field-level detail explaining the error
          required:
          - status
          - message
      required:
      - responseData
    SuccessGeneralData:
      type: object
      description: Success envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: Status code
      required:
      - responseData
    ErrorData:
      type: object
      description: Error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
          required:
          - status
          - message
      required:
      - responseData
    CallNumber:
      type: object
      properties:
        id:
          type: integer
          description: Number ID
        country_code:
          type: integer
          description: Country calling code
        area_code:
          type: integer
          description: Local area code
        internal_name:
          type: string
          description: Internal name
        caller_id_e164:
          type: string
          description: Full number in international E.164 format
        is_redirected:
          type: boolean
          description: Is number redirected?
        connected_to:
          type: integer
          description: Routing type. Where is the number connected. `0 = 'group'`, `1 = 'agent'`, `2 = 'conference room'`, `3 = 'fax'`
        source_id:
          type: integer
          description: Source ID of where is the number located, e.g. Agent ID, Group ID...
      description: Number data
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your API Access Key ID as the username and your API Access Key Secret as the password. Generate keys in the CloudTalk Dashboard under Account -> Settings -> API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys).
