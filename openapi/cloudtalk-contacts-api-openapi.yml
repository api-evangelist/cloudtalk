openapi: 3.2.0
info:
  title: CloudTalk Contacts API
  description: '# Introduction

    Welcome to CloudTalk API reference!'
  contact:
    name: CloudTalk API Support
    url: https://www.cloudtalk.io/contact
  version: '1.7'
  x-logo:
    url: https://my.cloudtalk.io/img/logo-cloudtalk-color.png
servers:
- url: https://my.cloudtalk.io/api
tags:
- name: Contacts
  description: All data you can get about your contacts.
paths:
  /contacts/index.json:
    get:
      tags:
      - Contacts
      summary: List contacts
      parameters:
      - name: country_id
        in: query
        description: Filter by country ID
        schema:
          type: integer
      - name: tag_id
        in: query
        description: Filter by tag ID
        schema:
          type: integer
      - name: industry
        in: query
        description: Filter by industry
        schema:
          type: string
      - name: keyword
        in: query
        description: Filter by keyword
        schema:
          type: string
      - name: limit
        in: query
        description: Max. number of items in response data.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - name: page
        in: query
        description: Number of page to return.
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          description: Contacts data
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsCount:
                    $ref: '#/components/schemas/PaginationData/properties/itemsCount'
                  pageCount:
                    $ref: '#/components/schemas/PaginationData/properties/pageCount'
                  pageNumber:
                    $ref: '#/components/schemas/PaginationData/properties/pageNumber'
                  limit:
                    $ref: '#/components/schemas/PaginationData/properties/limit'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Contact:
                          $ref: '#/components/schemas/ContactList'
                        ContactNumber:
                          $ref: '#/components/schemas/ContactNumber'
                        ContactEmail:
                          $ref: '#/components/schemas/ContactEmail'
                        ContactAttribute:
                          $ref: '#/components/schemas/ContactAttribute'
              example:
                responseData:
                  itemsCount: 3
                  pageCount: 1
                  pageNumber: 1
                  limit: 3
                  data:
                  - Contact:
                      id: '1234'
                      name: John Doe
                      company: Google
                    ContactNumber:
                      public_number: 442012345678
                    ContactEmail:
                      email: john.doe@gmail.com
      operationId: getContactsIndexJson
      x-operation-id-source: derived
  /contacts/add.json:
    put:
      tags:
      - Contacts
      summary: Add contact
      requestBody:
        content:
          application/json:
            schema:
              required:
              - name
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/Contact/properties/name'
                title:
                  $ref: '#/components/schemas/Contact/properties/title'
                company:
                  $ref: '#/components/schemas/Contact/properties/company'
                industry:
                  $ref: '#/components/schemas/Contact/properties/industry'
                website:
                  $ref: '#/components/schemas/Contact/properties/website'
                address:
                  $ref: '#/components/schemas/Contact/properties/address'
                city:
                  $ref: '#/components/schemas/Contact/properties/city'
                zip:
                  $ref: '#/components/schemas/Contact/properties/zip'
                state:
                  $ref: '#/components/schemas/Contact/properties/state'
                country_id:
                  $ref: '#/components/schemas/Contact/properties/country_id'
                favorite_agent:
                  $ref: '#/components/schemas/Contact/properties/favorite_agent'
                ExternalUrl:
                  $ref: '#/components/schemas/ExternalUrlArray'
                ContactNumber:
                  $ref: '#/components/schemas/ContactNumberArray'
                ContactEmail:
                  $ref: '#/components/schemas/ContactEmailArray'
                ContactsTag:
                  $ref: '#/components/schemas/ContactsTag'
                ContactAttribute:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute_id:
                        $ref: '#/components/schemas/ContactAttribute/items/properties/attribute_id'
                      value:
                        $ref: '#/components/schemas/ContactAttribute/items/properties/value'
        required: true
      responses:
        '201':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusCode/properties/status'
                  data:
                    type: object
                    properties:
                      id:
                        $ref: '#/components/schemas/Contact/properties/id'
              example:
                responseData:
                  status: 201
                  data:
                    id: '12345'
        '406':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidData'
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
                  data:
                    email:
                    - Please supply a valid email address.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      x-codegen-request-body-name: body
      operationId: putContactsAddJson
      x-operation-id-source: derived
  /contacts/edit/{contactId}.json:
    post:
      tags:
      - Contacts
      summary: Edit contact
      description: Only sent parameters/values will be updated. If you want to clear the value, just set empty string for that attribute. After sending empty string for properties of `ContactNumber`, `ContactEmail`, `ContactsTag` or `ContactAttribute` all data from these properties will be cleared. When you send values for properties of `ContactNumber`, `ContactEmail`, `ContactsTag` or `ContactAttribute` only these data will be updated, all other will be cleared.
      parameters:
      - name: contactId
        in: path
        description: Contact ID to edit
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/Contact/properties/name'
                title:
                  $ref: '#/components/schemas/Contact/properties/title'
                company:
                  $ref: '#/components/schemas/Contact/properties/company'
                industry:
                  $ref: '#/components/schemas/Contact/properties/industry'
                website:
                  $ref: '#/components/schemas/Contact/properties/website'
                address:
                  $ref: '#/components/schemas/Contact/properties/address'
                city:
                  $ref: '#/components/schemas/Contact/properties/city'
                zip:
                  $ref: '#/components/schemas/Contact/properties/zip'
                state:
                  $ref: '#/components/schemas/Contact/properties/state'
                country_id:
                  $ref: '#/components/schemas/Contact/properties/country_id'
                favorite_agent:
                  $ref: '#/components/schemas/Contact/properties/favorite_agent'
                ExternalUrl:
                  $ref: '#/components/schemas/ExternalUrlArray'
                ContactNumber:
                  $ref: '#/components/schemas/ContactNumberArray'
                ContactEmail:
                  $ref: '#/components/schemas/ContactEmailArray'
                ContactsTag:
                  $ref: '#/components/schemas/ContactsTag'
                ContactAttribute:
                  type: array
                  items:
                    type: object
                    properties:
                      attribute_id:
                        $ref: '#/components/schemas/ContactAttribute/items/properties/attribute_id'
                      value:
                        $ref: '#/components/schemas/ContactAttribute/items/properties/value'
        required: true
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusCode/properties/status'
              example:
                responseData:
                  status: 200
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '406':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidData'
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
                  data:
                    email:
                    - Please supply a valid email address.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      x-codegen-request-body-name: body
      operationId: postContactsEdit{contactId}Json
      x-operation-id-source: derived
  /contacts/delete/{contactId}.json:
    delete:
      tags:
      - Contacts
      summary: Delete contact
      parameters:
      - name: contactId
        in: path
        description: Contact ID to delete
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessGeneralData'
              example:
                responseData:
                  status: 200
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '500':
          description: Something went wrong
          content:
