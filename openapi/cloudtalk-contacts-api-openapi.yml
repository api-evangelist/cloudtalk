components:
  schemas:
    ContactAttribute:
      type: array
      description: Attributes for contact - can include multiple
      items:
        type: object
        properties:
          attribute_id:
            type: integer
            description: Attribute ID
          title:
            type: string
            description: Attribute name (max 255 chars per attribute)
            maxLength: 255
          value:
            type: string
            description: Attribute value (max 255 chars per attribute)
            maxLength: 255
    ContactNumber:
      type: object
      properties:
        public_number:
          type: string
          description: Full number in international E.164 format
      description: Number assigned to contact
    SuccessGeneralData:
      type: object
      description: Success envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: Status code
      required:
      - responseData
    ExternalUrlArray:
      type: array
      maxItems: 3
      description: List of all URLs which points to a detail page of a contact in an external service, e.g. CRMs, Helpdesk or any other custom service you use. You may list up to 3 URLs.
      items:
        type: object
        properties:
          name:
            maxLength: 30
            type: string
            description: Name of external service. Name will be shown to agents while working with contacts.
          url:
            type: string
            description: External URL to contact page
    ErrorData:
      type: object
      description: Error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
          required:
          - status
          - message
      required:
      - responseData
    ContactNote:
      type: object
      properties:
        id:
          type: integer
          description: Note ID
        contact_id:
          type: integer
          description: Assigned contact ID
        user_id:
          type: integer
          description: Assigned agent ID
        note:
          type: string
          description: Note content
        created:
          type: string
          description: Created date and time
          format: date-time
      description: Note data
    ContactEmailArray:
      type: array
      description: Emails assigned to contact
      items:
        type: object
        properties:
          email:
            type: string
            description: Email address
            format: email
    ContactActivity:
      type: object
      properties:
        id:
          type: integer
          description: Activity ID
        contact_id:
          type: integer
          description: Assigned contact ID
        type:
          type: string
          description: Type of activity
          enum:
          - order
          - task
          - chat
          - ticket
          - other
          - invoice
          - proforma
          - estimate
          - cancel
        name:
          type: string
          description: Name/Title
        description:
          type: string
          description: Detailed description
        activity_author:
          type: string
          description: Author of activity - user name you want to show
        external_id:
          type: integer
          description: Activity ID from external resource - e.g. your order ID
        external_url:
          type: string
          description: External url which can be opened from activity detail
        activity_date:
          type: string
          description: Activity date and time. Set to current company time by default.
          format: date-time
        created:
          type: string
          description: Created date and time
          format: date-time
      description: Activity data
    ContactNumberArray:
      type: array
      description: Numbers assigned to contact
      items:
        type: object
        properties:
          public_number:
            type: string
            description: Full number in international E.164 format
