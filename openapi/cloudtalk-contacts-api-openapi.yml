      type: object
      properties:
        id:
          type: integer
          description: Contact ID
        name:
          type: string
          description: Name
          maxLength: 150
        title:
          type: string
          description: Title
          maxLength: 255
        company:
          type: string
          description: Company name
          maxLength: 100
        industry:
          type: string
          description: Industry
          maxLength: 100
        website:
          type: string
          description: Website
          maxLength: 100
        address:
          type: string
          description: Address
          maxLength: 255
        city:
          type: string
          description: City
          maxLength: 255
        zip:
          type: string
          description: ZIP code
          maxLength: 15
        state:
          type: string
          description: State
          maxLength: 255
        country_id:
          type: integer
          description: Country ID
        favorite_agent:
          type: integer
          description: Favorite agent ID
        type:
          type: string
          description: Type of contact (contact/lead)
        created:
          type: string
          description: Created date and time
          format: date-time
        modified:
          type: string
          description: Last modified date and time
          format: date-time
        contact_numbers:
          type: array
          description: Array of contact numbers
          items:
            type: string
        contact_emails:
          type: array
          description: Array of contact emails
          items:
            type: string
        tags:
          type: array
          description: Array of contact tags
          items:
            type: object
            properties:
              id:
                type: integer
                description: Tag ID
              name:
                type: string
                description: Tag name
        external_urls:
          type: array
          description: Array of contact external urls
          items:
            type: object
            properties:
              external_system:
                type: string
                description: Name of external service. Name will be shown to agents while working with contacts.
              external_url:
                type: string
                description: External URL to contact page
        custom_fields:
          type: array
          description: Array of contact emails
          items:
            type: object
            maximum: 255
            properties:
              key:
                type: string
                description: Custom field key (max 255 chars per attribute)
              value:
                type: string
                description: Custom field value (max 255 chars per attribute)
