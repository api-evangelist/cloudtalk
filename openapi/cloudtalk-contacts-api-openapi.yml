                  ExternalUrl:
                    $ref: '#/components/schemas/ExternalUrlArray'
                  ContactNumber:
                    $ref: '#/components/schemas/ContactNumberArray'
                  ContactEmail:
                    $ref: '#/components/schemas/ContactEmailArray'
                  ContactsTag:
                    $ref: '#/components/schemas/ContactsTag'
                  ContactAttribute:
                    $ref: '#/components/schemas/ContactAttribute'
              example:
                responseData:
                  Contact:
                    id: '1234'
                    name: John Doe
                    title: Dr.
                    company: Google
                    industry: it
                    website: https://www.google.com/
                    address: First st.
                    city: New York
                    zip: '11804'
                    state: NY
                    country_id: '1'
                    favorite_agent: '123'
                    created: '2017-11-11T15:25:42.000Z'
                    modified: '2017-04-26T22:57:50.000Z'
                  ExternalUrl:
                  - name: CRM
                    url: https://cloudtalk.io/c/show/123
                  ContactEmail:
                  - email: joh.doe@gmail.com
                  ContactNumber:
                  - public_number: 442012345678
                  ContactsTag:
                  - name: vipClients
                  - name: shopify
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
      operationId: getContactsShow{contactId}Json
      x-operation-id-source: derived
  /contacts/attributes.json:
    get:
      tags:
      - Contacts
      summary: Attributes
      description: List all attributes which can be assigned to a contact.
      responses:
        '200':
          description: All attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: array
                    items:
                      type: object
                      properties:
                        ContactAttribute:
                          type: object
                          properties:
                            id:
                              $ref: '#/components/schemas/ContactAttribute/items/properties/attribute_id'
                            title:
                              $ref: '#/components/schemas/ContactAttribute/items/properties/title'
              example:
                responseData:
                - ContactAttribute:
                    id: '123'
                    title: Salary
                - ContactAttribute:
                    id: '124'
                    title: Custom notes
      operationId: getContactsAttributesJson
      x-operation-id-source: derived
  /contacts/addTags/{contactId}.json:
    put:
      tags:
      - Contacts
      summary: Assign Tags
      description: Assign tags to contact.
      parameters:
      - name: contactId
        in: path
        description: Contact ID for adding tags
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              required:
              - tags
              type: object
              properties:
                tags:
                  type: array
                  description: Array of tag names
                  items:
                    type: string
        required: true
      responses:
        '200':
          description: Tags assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Tag ID
                            name:
                              type: string
                              description: Tag name
                      contact_id:
                        type: string
                        description: Contact ID
                    description: Data of assigned tags
              example:
                responseData:
                  status: 200
                  message: Tags were sucessfully added.
                  data:
                    tags:
                    - id: '123'
                      name: First
                    - id: '456'
                      name: Second
                    - id: '789'
                      name: Third
                    contact_id: '123456'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code
                  message:
                    type: string
                    description: Error message
              example:
                responseData:
                  status: 404
                  message: Not found.
        '406':
          description: Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code
                  message:
                    type: string
                    description: Error message
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
      x-codegen-request-body-name: body
      operationId: putContactsAddTags{contactId}Json
      x-operation-id-source: derived
  /contacts/removeTags/{contactId}.json:
    delete:
      tags:
      - Contacts
      summary: Unassign Tags
      description: Unassign tags to contact.
      parameters:
      - name: contactId
        in: path
        description: Contact ID for deleting tags
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              required:
