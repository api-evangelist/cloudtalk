                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Tag ID
                            name:
                              type: string
                              description: Tag name
                      contact_id:
                        type: string
                        description: Contact ID
                    description: Data of unassigned tags
              example:
                responseData:
                  status: 200
                  message: Tags were successfully removed.
                  data:
                    tags:
                    - id: '123'
                      name: First
                    - id: '456'
                      name: Second
                    - id: '789'
                      name: Third
                    contact_id: '123456'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code
                  message:
                    type: string
                    description: Error message
              example:
                responseData:
                  status: 404
                  message: Not found.
        '406':
          description: Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Status code
                  message:
                    type: string
                    description: Error message
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
      x-codegen-request-body-name: body
      operationId: deleteContactsRemoveTags{contactId}Json
      x-operation-id-source: derived
  /notes/index.json:
    get:
      tags:
      - Contacts
      summary: List notes
      description: List all notes assigned to contacts
      parameters:
      - name: contact_id
        in: query
        description: Filter by contact ID
        schema:
          type: integer
      - name: user_id
        in: query
        description: Filter by agent ID
        schema:
          type: integer
      - name: keyword
        in: query
        description: Filter by keyword in note content
        schema:
          type: string
      - name: limit
        in: query
        description: Max. number of items in response data.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - name: page
        in: query
        description: Number of page to return.
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
