              example:
                responseData:
                  itemsCount: 3
                  pageCount: 1
                  pageNumber: 1
                  limit: 3
                  data:
                  - ContactNote:
                      id: '1234'
                      contact_id: '567'
                      user_id: '456'
                      note: Note content...
                      created: '2018-05-01T12:12:12.000Z'
      operationId: getNotesIndexJson
      x-operation-id-source: derived
  /notes/add/{contactId}.json:
    put:
      tags:
