    ErrorInvalidData:
      type: object
      description: Validation-error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
            data:
              type: object
              properties: {}
              description: Field-level detail explaining the error
          required:
          - status
          - message
      required:
      - responseData
    ContactEmail:
      type: object
      properties:
        email:
          type: string
          description: Email address
          format: email
      description: Email assigned to contact
    ContactsTag:
      type: array
      description: Tags for contact - can include multiple
      items:
        type: object
        properties:
          name:
            type: string
            description: Tag
    ContactList:
      type: object
      properties:
        id:
          type: integer
          description: Contact ID
        name:
          type: string
          description: Name
        company:
          type: string
          description: Company name
      description: Contact data
