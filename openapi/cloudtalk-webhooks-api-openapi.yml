          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '429':
          description: Too many test or retry requests for this company in the current minute (code RATE_LIMIT.EXCEEDED), with the X-CloudTalkAPI-Send-* headers. A 429 can also come from the gateway's API rate limit; that one carries X-CloudTalkAPI-Limit, -Remaining and -ResetTime instead and no error body.
          headers:
            X-CloudTalkAPI-Send-Limit:
              description: Test and retry requests allowed per company in the current one-minute window.
              schema:
                type: integer
            X-CloudTalkAPI-Send-Remaining:
              description: Test and retry requests left in the current window.
              schema:
                type: integer
            X-CloudTalkAPI-Send-ResetTime:
              description: Unix timestamp (seconds) when the current window resets.
              schema:
                type: integer
            Retry-After:
              description: Seconds until the window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '502':
          description: The webhook service is unavailable (code WEBHOOKS.UPSTREAM_UNAVAILABLE). Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
        '504':
          description: The webhook service did not answer within the 10-second request budget (code WEBHOOKS.UPSTREAM_TIMEOUT). Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorBody'
components:
  schemas:
    PublicErrorObject:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/PublicErrorDetail'
          type:
          - array
          - 'null'
        message:
          type: string
        target:
          type: string
      required:
      - code
      - message
      type: object
    WebhookTestRequest:
      type: object
      additionalProperties: false
      required:
      - eventType
      properties:
        eventType:
          type: string
          example: call.ended
    PublicErrorBody:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/PublicErrorObject'
        requestId:
          type: string
      required:
      - error
      - requestId
      type: object
    WebhookDeliveryList:
      type: object
      required:
      - data
      - pagination
      - requestId
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        pagination:
          $ref: '#/components/schemas/PublicPagination'
        requestId:
          type: string
    WebhookAcceptedDelivery:
      type: object
      required:
      - deliveryId
      properties:
        deliveryId:
          type: string
          example: msg_2nJ5bQw1pX7cT4aZsY8vHk0dLr3
    WebhookEndpointList:
      type: object
      required:
      - data
      - pagination
      - requestId
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        pagination:
          $ref: '#/components/schemas/PublicPagination'
        requestId:
          type: string
    WebhookEndpointUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 500
        eventTypes:
          type:
          - array
          - 'null'
          minItems: 1
          items:
            type: string
          description: Replaces the subscription. `null` subscribes to every event type.
        enabled:
          type: boolean
    WebhookSecret:
      type: object
      required:
      - secret
      properties:
        secret:
          type: string
          example: whsec_EXAMPLE_SIGNING_SECRET
    WebhookEventType:
      type: object
      required:
      - name
      - description
      - groupName
      properties:
        name:
          type: string
          example: call.ended
        description:
          type: string
        groupName:
          type: string
          example: call
        schemas:
          type: object
          description: 'Only with `include=schema`: the JSON Schema of the full webhook body, keyed by version.'
          additionalProperties:
            type: object
    WebhookEndpointCreate:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 2048
          description: '`https://` URL on a public host whose name ends in a public top-level domain.'
        description:
          type: string
          maxLength: 500
        eventTypes:
          type:
          - array
          - 'null'
          minItems: 1
          items:
            type: string
          description: Event types to receive (see List webhook event types). Omit or send null for every event type. An empty list is rejected.
    WebhookEventTypeList:
      type: object
      required:
      - data
      - requestId
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        requestId:
          type: string
    WebhookDelivery:
      type: object
      required:
      - id
      - eventType
      - eventId
      - status
      - nextAttemptAt
      - createdAt
      properties:
        id:
          type: string
          description: Delivery id; the same value as the `svix-id` header of the delivered request.
        eventType:
          type: string
        eventId:
          type:
          - string
          - 'null'
          description: The `event_id` of the webhook body, the key to deduplicate on.
        status:
          type: string
          enum:
          - succeeded
          - failed
          - retrying
          - pending
          - canceled
          description: '`retrying`: an attempt failed and another is scheduled at `nextAttemptAt`. `failed`: the last attempt failed and no retry is scheduled.'
        nextAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    WebhookDeliveryAttempt:
      type: object
      required:
      - id
      - createdAt
      - status
      - responseStatusCode
      - responseDurationMs
      - responseBody
      - responseTruncated
      - trigger
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - succeeded
          - failed
          - pending
          - canceled
        responseStatusCode:
          type: integer
          description: HTTP status your server answered; 0 when it could not be reached.
        responseDurationMs:
          type: integer
        responseBody:
          type: string
          description: Your server's response body, at most 4 KB. When no HTTP response came back (`responseStatusCode` 0), a fixed message instead.
        responseTruncated:
          type: boolean
        trigger:
          type: string
          enum:
          - scheduled
          - manual
          description: '`manual` for a retry you requested.'
    PublicPagination:
      additionalProperties: false
      properties:
        limit:
          format: int64
          type: integer
        next:
          type:
          - string
          - 'null'
      required:
      - limit
      - next
      type: object
    PublicErrorDetail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
      required:
      - code
      - message
      type: object
    WebhookEndpoint:
      type: object
      required:
      - id
      - url
      - description
      - eventTypes
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          example: ep_2nJ4qKZr8C1tY0dXwV3uFh7bM9s
        url:
          type: string
          description: As stored; the host may come back lowercased and a bare host with a trailing slash.
        description:
          type: string
        eventTypes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Subscribed event types, sorted. `null` means every event type, including ones added later.
        status:
          type: string
          enum:
          - enabled
          - disabled
          - failing
          description: '`disabled`: turned off by you (Dashboard or API). `failing`: turned off automatically after repeated delivery failures; it may be re-enabled automatically, or by you.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        secret:
          type: string
          description: 'Only in the create response: the signing secret (`whsec_...`). Absent if it could not be read; then use the secret endpoint.'
    WebhookDeliveryDetail:
      allOf:
      - $ref: '#/components/schemas/WebhookDelivery'
      - type: object
        required:
        - payload
        - attempts
        properties:
          payload:
            type:
            - object
            - 'null'
            description: The body that was sent. `null` after the 30-day payload retention.
          attempts:
            type: array
            items:
              $ref: '#/components/schemas/WebhookDeliveryAttempt'
    WebhookRotatedSecret:
      type: object
      required:
      - secret
      - previousSecretExpiresAt
      properties:
        secret:
          type: string
          description: The new signing secret.
          example: whsec_EXAMPLE_NEW_SIGNING_SECRET
        previousSecretExpiresAt:
          type: string
          format: date-time
          description: 'When the previous secret stops signing deliveries: 24 hours after the rotation. Until then every delivery carries signatures from both secrets.'
          example: '2026-10-15T09:30:12Z'
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            description: Error envelope returned by the authentication layer in front of the `api.cloudtalk.io/v1` surface. It differs from the per-service error shapes used for other statuses.
            properties:
              code:
                type: string
                description: Error code
                example: UNAUTHORIZED
              message:
                type: string
                description: Error message
                example: You are not authorized to access this resource.
            required:
            - code
            - message
          example:
            code: UNAUTHORIZED
            message: You are not authorized to access this resource.
    WebhooksRateLimited:
      description: 'Too many requests: this company is over the API rate limit (see the Rate limiting guide). The gateway answers before the request reaches the webhooks API, so there is no JSON error body; rely on the status and the headers X-CloudTalkAPI-Limit, X-CloudTalkAPI-Remaining and X-CloudTalkAPI-ResetTime.'
      headers:
        X-CloudTalkAPI-Limit:
          description: Requests allowed per company in the current one-minute window.
          schema:
            type: integer
        X-CloudTalkAPI-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
        X-CloudTalkAPI-ResetTime:
          description: Unix timestamp (seconds) when the current window resets.
          schema:
            type: integer
      content:
        text/plain:
          schema:
            type: string
            description: Empty or a short plain-text reason from the gateway. Do not parse it.
          example: ''
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your API Access Key ID as the username and your API Access Key Secret as the password. Generate keys in the CloudTalk Dashboard under Account -> Settings -> API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys).
