security:
- basicAuth: []
tags:
- name: Groups
paths:
  /groups/index.json:
    get:
      tags:
      - Groups
      summary: List groups
      description: Returns the account's agent groups. Page through the result with `limit` and `page`; the envelope carries `itemsCount`, `pageCount`, `pageNumber` and `limit` alongside the `data` array.
      parameters:
      - name: limit
        in: query
        description: Max. number of items in response data.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - name: page
        in: query
        description: Number of page to return.
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          description: Groups data
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      itemsCount:
                        type: integer
                        description: number of resources in the response
                        format: int64
                      pageCount:
                        type: integer
                        description: number of pages found
                        format: int64
                      pageNumber:
                        type: integer
                        description: current page in the response
                        format: int64
                      limit:
                        type: integer
                        description: number of objects sent per page
                        format: int64
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            Groups:
                              $ref: '#/components/schemas/Group'
                required:
                - responseData
              example:
                responseData:
                  itemsCount: 9
                  pageCount: 1
                  pageNumber: 1
                  limit: 9
                  data:
                  - Group:
                      id: '568'
                      internal_name: Operátori
      operationId: getGroupsIndexJson
      x-operation-id-source: derived
  /groups/add.json:
    put:
      tags:
      - Groups
      summary: Add agent to group
      description: 'Adds an agent to a group. Both `group_id` and `agent_id` are required and together identify the membership to create.


        Note the core API creates with `PUT`, not `POST`.'
      requestBody:
        content:
          application/json:
            schema:
              required:
              - group_id
              - agent_id
              type: object
              properties:
                group_id:
                  type: integer
                  description: Group ID
                agent_id:
                  type: integer
                  description: Agent ID
        required: true
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Status code
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Agent ID
                required:
                - responseData
              example:
                responseData:
                  status: 200
                  data:
                    message: Agent added successfully.
        '406':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidData'
              example:
                responseData:
                  status: 406
                  message: Invalid input data.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      x-codegen-request-body-name: body
      operationId: putGroupsAddJson
      x-operation-id-source: derived
  /groups/delete/{agent_id}.json:
    delete:
      tags:
      - Groups
      summary: Remove agent from group
      description: Removes one agent from one group. The agent comes from the `agent_id` path parameter and the group from `group_id` in the request body — this deletes a single membership, not the agent and not the group. Returns `404` if the group does not exist.
      parameters:
      - name: agent_id
        in: path
        description: Agent ID to delete
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              required:
              - group_id
              type: object
              properties:
                group_id:
                  type: integer
                  description: Group ID
        required: true
      responses:
        '200':
          description: No error
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseData:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Status code
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Agent ID
                required:
                - responseData
              example:
                responseData:
                  status: 200
                  data:
                    message: Agent deleted successfully.
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 404
                  message: Not found.
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
              example:
                responseData:
                  status: 500
                  message: Something went wrong.
      operationId: deleteGroupsDelete{agentId}Json
      x-operation-id-source: derived
components:
  schemas:
    ErrorInvalidData:
      type: object
      description: Validation-error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
            data:
              type: object
              properties: {}
              description: Field-level detail explaining the error
          required:
          - status
          - message
      required:
      - responseData
    ErrorData:
      type: object
      description: Error envelope returned by the core API on `my.cloudtalk.io/api`. The payload is always wrapped in `responseData`.
      properties:
        responseData:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
            message:
              type: string
              description: The error message
          required:
          - status
          - message
      required:
      - responseData
    Group:
      type: object
      properties:
        id:
          type: integer
          description: Group ID
        internal_name:
          type: string
          description: Group name
      description: Campaign group
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your API Access Key ID as the username and your API Access Key Secret as the password. Generate keys in the CloudTalk Dashboard under Account -> Settings -> API Keys (https://dashboard.cloudtalk.io/menu/account/settings/API-keys).
