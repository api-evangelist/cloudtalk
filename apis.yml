aid: cloudtalk
name: CloudTalk
description: >-
  CloudTalk is an AI-powered cloud call center and business phone system (CCaaS) for sales and
  customer support teams, backed by Point Nine. Its public REST API (served at
  https://my.cloudtalk.io/api, published as OpenAPI 3.0.1 version 1.7) lets developers automate
  calls, contacts, agents, groups, phone numbers, campaigns, tags, SMS, blacklists and notes, and
  read Conversation Intelligence data — transcription, sentiment, topics, talk-listen ratio and
  smart notes — plus initiate VoiceAgent calls. Authentication is HTTPS-only HTTP Basic Auth using
  an API Access Key ID and Secret; responses are JSON, paginated with a Collections Envelope, and
  rate limited to 60 requests per minute per company. Events are delivered through Workflow
  Automation triggers (native and virtual webhooks) rather than the REST API.
